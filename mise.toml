# ---- Benchmarks, three ways: the library and each example, the same way --------------------------------------------

[tasks.bench]
description = """The library's benchmarks three ways (6 runs of 200ms each), compared with benchstat, into \
BENCH_GENERATED.md."""
depends = ["generate"]
quiet = true
run = "{{vars.dev}} bench ."

[tasks."bench:examples"]
description = """Every example with benchmarks (examples/todo, so far), three ways, in-process and as served, each into \
its own BENCH_GENERATED.md, as bench does for the library. examples/todo alone: example:todo:bench."""
depends = ["example:htmx:bench", "example:htmx-render-target:bench", "example:simple:bench", "example:todo:bench", "example:url-validation:bench"]

[tasks."lint:examples"]
description = "structpages-lint (tools/lint) over every example but lint-misuse, whose misuses are deliberate."
depends = ["examples:generate"]
dir = "tools/lint"
run = '''
fail=0
for d in ../../examples/*/; do
  case "$d" in */lint-misuse/) continue ;; esac
  echo "== $d"
  # The linter loads packages from its working directory, so -exec starts it in the example's.
  go run -exec "sh -c 'cd $d && exec \"\$@\"' sh" ./cmd/structpages-lint ./... || fail=1
done
exit $fail
'''

# ---- What upstream's CI checks, on standard Go --------------------------------------------------------------------

[tasks."ci:go"]
description = """Everything CI checks on standard Go: fmt, vet, lint, generated:check, then the library and every \
example built and tested the dynamic way, as test and examples do."""
depends = ["fmt", "vet", "lint", "generated:check", "example:htmx:test:dynamic", "example:htmx-render-target:test:dynamic", "example:simple:test:dynamic", "example:todo:test:dynamic", "example:url-validation:test:dynamic"]
quiet = true
run = [
  "{{vars.dev}} test -ways dynamic .",
  "{{vars.dev}} test -ways dynamic examples/blog",
  "{{vars.dev}} test -ways dynamic examples/html-template",
  "{{vars.dev}} test -ways dynamic examples/lint-misuse",
]

[tasks.fmt]
description = "Fail if any file needs gofmt (CI's Format job)."
wait_for = ["generate", "examples:generate"] # not while they write files, when ci:go runs them too
run = 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'

# vet and lint check each module, and again with the build tags that pick other files: the library's static and
# tinygo files (e2e's among them, and the library's generated test files, so they run after generate) and the workers
# module's js/wasm one, which TinyGo builds.
[tasks.vet]
depends = ["generate"]
description = "go vet on the library, workers, tools/static, tools/dev and tools/workers, each build too (CI's Format job)."
run = [
  "go vet ./...",
  "go vet -tags structpages_static ./...",
  "go vet -tags tinygo ./...",
  "go vet -C workers ./...",
  "GOOS=js GOARCH=wasm go vet -C workers ./...",
  "go vet -C tools/static ./...",
  "go vet -C tools/dev ./...",
  "go vet -C tools/workers ./...",
]

[tasks.lint]
depends = ["generate"]
description = "golangci-lint on the library, workers, tools/static, tools/dev and tools/workers, each build too (CI's Lint job)."
run = [
  "golangci-lint run --timeout=5m",
  "golangci-lint run --timeout=5m --build-tags structpages_static",
  "golangci-lint run --timeout=5m --build-tags tinygo",
  "cd workers && golangci-lint run --timeout=5m",
  "cd workers && GOOS=js GOARCH=wasm golangci-lint run --timeout=5m",
  "cd tools/static && golangci-lint run --timeout=5m",
  "cd tools/dev && golangci-lint run --timeout=5m",
  "cd tools/workers && golangci-lint run --timeout=5m",
]
