# Local dev setup for this fork's tinygo branch (upstream has no mise file); versions follow
# .github/workflows/ci.yml. `mise tasks` lists everything.
#
# structpages runs three ways, and most tasks come in threes:
#   dynamic        standard Go, the default: structpages finds the app's methods at run time, with reflect
#   static         standard Go, -tags structpages_static: they are known at compile time, from the code
#                  `structpages-static generate` writes
#   static-worker  a Cloudflare Worker: TinyGo WebAssembly, static too
#
# THE ORDER. Some files are made from others, so an example's steps run in an order, each reading what the one
# before wrote: generate:gsx (.gsx -> .x.go), generate:structpages-static (-> structpages_static.generated.go),
# generate:e2e (its answers, from the dynamic build -> testdata/e2e.generated.txt), then test, build, serve and bench,
# each way. Every example's section below has each step as a task of its own, depending on the one before, all of
# the same shape (html-template and lint-misuse have fewer ways, and say why).
#
# What generate makes is committed for the examples, as upstream commits .x.go: commit it with the code it comes
# from (generated:check, and so ci:go, fails until you have). A change to testdata/e2e.generated.txt is a change in
# what the app answers: review its diff. The library's generated files are for its own tests only and gitignored.
# A task over several folders lists them, a line each.

[tools]
go = "1.26"
tinygo = "0.43.0"
"aqua:WebAssembly/binaryen" = "133" # wasm-opt, for TinyGo's WebAssembly builds
workerd = "1.20261019.1"            # Cloudflare's Workers runtime, to serve TinyGo builds locally
golangci-lint = "2"
"go:golang.org/x/perf/cmd/benchstat" = "latest"

[env]
# structpages-dev, which tools:dev builds, is on the path for every task.
_.path = ["{{config_root}}/build/bin"]

# ---- This repository's dev tool -----------------------------------------------------------------------------------

[tasks."tools:dev"]
description = "Build structpages-dev (tools/dev) into build/bin, on the path for every task; again only when its code changes."
sources = ["tools/dev/**/*.go", "tools/dev/go.mod", "e2e/*.go"]
outputs = ["build/bin/structpages-dev"]
run = "go build -C tools/dev -o {{config_root}}/build/bin/structpages-dev ./cmd/structpages-dev"

# ---- The library (the root folder): its tasks, one per step, in the order they run ---------------------------------
#
# Each task runs in the root folder, after the tasks it depends on:
#   generate -> test:dynamic, test:static, test:static-worker
#   generate -> bench:dynamic -> bench:static -> bench:static-worker -> bench (the report)
# The library is no app, so it has no e2e test, build or serve. Its generated files are for its own tests' static and
# static-worker builds, and gitignored.

[tasks.generate]
description = "The library: structpages-static generate makes its tests' generated files (gitignored)."
run = "go run -C tools/static ./cmd/structpages-static generate -C {{config_root}} -test ./..."

[tasks."test:dynamic"]
description = "The library: test it, dynamic."
depends = ["generate", "tools:dev"]
run = "structpages-dev test dynamic"

[tasks."test:static"]
description = "The library: test it, static."
depends = ["generate", "tools:dev"]
run = "structpages-dev test static"

[tasks."test:static-worker"]
description = "The library: test it, static-worker."
depends = ["generate", "tools:dev"]
run = "structpages-dev test static-worker"

[tasks.test]
description = "The library: test it all three ways."
depends = ["test:dynamic", "test:static", "test:static-worker"]

# The bench tasks time one way at a time: wait_for waits for a task only if it is running, so bench:static alone runs
# just itself.

[tasks."bench:dynamic"]
description = "The library: time its benchmarks, dynamic, into build/bench/."
depends = ["generate", "tools:dev"]
run = "structpages-dev bench dynamic"

[tasks."bench:static"]
description = "The library: time its benchmarks, static, into build/bench/."
depends = ["generate", "tools:dev"]
wait_for = ["bench:dynamic"]
run = "structpages-dev bench static"

[tasks."bench:static-worker"]
description = "The library: time its benchmarks, static-worker, into build/bench/."
depends = ["generate", "tools:dev"]
wait_for = ["bench:static"]
run = "structpages-dev bench static-worker"

[tasks.bench]
description = "The library: time it all three ways, one at a time, and compare them into BENCH_GENERATED.md."
depends = ["bench:dynamic", "bench:static", "bench:static-worker"]
run = "structpages-dev report"

# ---- examples/blog: its tasks, one per step, in the order they run ---------------------------------------------------
#
# Each task runs in examples/blog, after the tasks it depends on:
#   generate:gsx -> generate:structpages-static -> generate:e2e
#     -> test:dynamic, test:static, test:static-worker
#     -> build:dynamic       -> serve:dynamic
#     -> build:static        -> serve:static
#     -> build:static-worker -> serve:static-worker
#   build (all three) -> bench:dynamic -> bench:static -> bench:static-worker -> bench (the report)
# Builds go in examples/blog/build/ (gitignored).
# `mise tasks deps example:blog:serve:static` prints a chain.
# The serve tasks have raw = true: mise hands them the terminal, as typing the command yourself does, so the server's
# log lines show as they are, without the task's name in front of each. It changes nothing about what runs.

[tasks."example:blog:generate:gsx"]
description = "blog: gsx makes the .x.go files."
dir = "examples/blog"
run = "go tool gsx generate"

[tasks."example:blog:generate:structpages-static"]
description = "blog: structpages-static generate makes structpages_static.generated.go."
depends = ["example:blog:generate:gsx"]
dir = "examples/blog"
run = "go tool structpages-static generate"

[tasks."example:blog:generate:e2e"]
description = "blog: the e2e test records blog's answers into testdata/e2e.generated.txt."
depends = ["example:blog:generate:structpages-static"]
dir = "examples/blog"
run = "go test -update"

[tasks."example:blog:generate"]
description = "blog: all three generate tasks."
depends = ["example:blog:generate:e2e"]

[tasks."example:blog:test:dynamic"]
description = "blog: test it, dynamic."
depends = ["example:blog:generate", "tools:dev"]
dir = "examples/blog"
run = "structpages-dev test dynamic"

[tasks."example:blog:test:static"]
description = "blog: test it, static."
depends = ["example:blog:generate", "tools:dev"]
dir = "examples/blog"
run = "structpages-dev test static"

[tasks."example:blog:test:static-worker"]
description = "blog: test it, static-worker."
depends = ["example:blog:generate", "tools:dev"]
dir = "examples/blog"
run = "structpages-dev test static-worker"

[tasks."example:blog:test"]
description = "blog: test it all three ways."
depends = ["example:blog:test:dynamic", "example:blog:test:static", "example:blog:test:static-worker"]

[tasks."example:blog:build:dynamic"]
description = "blog: build it, dynamic, into build/dynamic."
depends = ["example:blog:generate"]
dir = "examples/blog"
run = "go build -o build/dynamic ."

[tasks."example:blog:serve:dynamic"]
description = "blog: serve its dynamic build on :8080 until Ctrl-C."
depends = ["example:blog:build:dynamic", "tools:dev"]
dir = "examples/blog"
raw = true
run = "structpages-dev serve dynamic"

[tasks."example:blog:build:static"]
description = "blog: build it, static, into build/static."
depends = ["example:blog:generate"]
dir = "examples/blog"
run = "go build -tags structpages_static -o build/static ."

[tasks."example:blog:serve:static"]
description = "blog: serve its static build on :8080 until Ctrl-C."
depends = ["example:blog:build:static", "tools:dev"]
dir = "examples/blog"
raw = true
run = "structpages-dev serve static"

[tasks."example:blog:build:static-worker"]
description = "blog: build it, static-worker: a Worker (TinyGo WebAssembly and its glue), into build/static-worker/."
depends = ["example:blog:generate"]
dir = "examples/blog"
run = "go tool structpages-workers -o build/static-worker"

[tasks."example:blog:serve:static-worker"]
description = "blog: serve its static-worker build in workerd on :8080 until Ctrl-C."
depends = ["example:blog:build:static-worker", "tools:dev"]
dir = "examples/blog"
raw = true
run = "structpages-dev serve static-worker"

[tasks."example:blog:build"]
description = "blog: build it all three ways."
depends = ["example:blog:build:dynamic", "example:blog:build:static", "example:blog:build:static-worker"]

# The bench tasks time one way at a time, after every build: wait_for waits for a task only if it is running, so
# bench:static alone runs just itself.

[tasks."example:blog:bench:dynamic"]
description = "blog: time it, dynamic: in-process, then its build served, into build/bench/."
depends = ["example:blog:build:dynamic", "tools:dev"]
wait_for = ["example:blog:build"]
dir = "examples/blog"
run = "structpages-dev bench dynamic"

[tasks."example:blog:bench:static"]
description = "blog: time it, static: in-process, then its build served, into build/bench/."
depends = ["example:blog:build:static", "tools:dev"]
wait_for = ["example:blog:build", "example:blog:bench:dynamic"]
dir = "examples/blog"
run = "structpages-dev bench static"

[tasks."example:blog:bench:static-worker"]
description = "blog: time it, static-worker: in-process, then its build served in workerd, into build/bench/."
depends = ["example:blog:build:static-worker", "tools:dev"]
wait_for = ["example:blog:build", "example:blog:bench:static"]
dir = "examples/blog"
run = "structpages-dev bench static-worker"

[tasks."example:blog:bench"]
description = "blog: time it all three ways, one at a time, and compare them into BENCH_GENERATED.md."
depends = ["example:blog:build", "example:blog:bench:dynamic", "example:blog:bench:static", "example:blog:bench:static-worker"]
dir = "examples/blog"
run = "structpages-dev report"

# ---- examples/html-template: its tasks, one per step, in the order they run ------------------------------------------
#
# Each task runs in examples/html-template, after the tasks it depends on:
#   generate:structpages-static -> generate:e2e
#     -> test:dynamic, test:static
