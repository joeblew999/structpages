# ---- The repo's two tools, over every example -------------------------------------------------------------------

[tasks."gen:examples"]
description = """structpages-gen (tools/gen) over every example: regenerates gsx output, then writes \
structpages.generated.go into each package with pages, and lists what it wrote."""
run = '''
fail=0
for d in examples/*/; do
  echo "== $d"
  if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then
    (cd "$d" && go tool gsx generate -q .) || fail=1
  fi
  go run -C tools/gen ./cmd/structpages-gen -C "{{config_root}}/$d" ./... || fail=1
  find "$d" -name 'structpages*.generated*.go' | sed 's/^/   generated: /'
done
exit $fail
'''

[tasks."lint:examples"]
description = "structpages-lint (tools/lint) over every example but lint-misuse, whose misuses are deliberate."
dir = "tools/lint"
run = '''
fail=0
for d in ../../examples/*/; do
  case "$d" in */lint-misuse/) continue ;; esac
  echo "== $d"
  # The linter loads packages from its working directory, so -exec starts it in the example's.
  go run -exec "sh -c 'cd $d && exec \"\$@\"' sh" ./cmd/structpages-lint ./... || fail=1
done
exit $fail
'''

[tasks."clean:generated"]
description = "Delete everything generated: the structpages*.generated*.go files and the examples' worker.generated/."
run = [
  "find . -name 'structpages*.generated*.go' -not -path './.git/*' -print -delete | sed 's/^/deleted /'",
  "find examples -type d -name worker.generated -prune -print -exec rm -rf {} + | sed 's/^/deleted /'",
]

# ---- Benchmarks, three ways: the library (the root folder) and each example, the same way -------------------------

[tasks.bench]
description = """The library's benchmarks three ways (6 runs of 200ms each), compared with benchstat, into \
BENCH_GENERATED.md."""
quiet = true
run = "mise run _bench ."

[tasks."bench:examples"]
description = """Every example's benchmarks three ways, in-process and as served, each into its own BENCH_GENERATED.md, \
as bench does for the library. One example: example:<name>:bench."""
quiet = true
run = '''
for d in examples/*/; do
  grep -qs '^func Benchmark' "$d"*_test.go || continue
  mise run _bench "${d%/}" || exit 1
done
'''

[tasks._bench]
description = """The benchmarks of <dir> (. for the library, or examples/<name>) three ways, compared with benchstat, into \
<dir>/BENCH_GENERATED.md; an example serving through workers is timed as served too (tinygo: WebAssembly in workerd)."""
hide = true
quiet = true
shell = "bash -c"
usage = '''arg "<dir>" help=". for the library, or examples/<name>"'''
run = '''
set -euo pipefail
d=$usage_dir; name=$([ "$d" = . ] && echo library || basename "$d")
# What this run generates goes when it ends, as it fails or not: the code, and the WebAssembly served in workerd.
cleanup() {
  find "$d" \( -path "$d/examples" -o -path "$d/tools" \) -prune -o -name 'structpages*.generated*.go' -print0 | xargs -0 rm -f
  rm -rf "$d/worker.generated"
}
trap cleanup EXIT
if ! grep -qs '^func Benchmark' "$d"/*_test.go; then
  echo "$d has no benchmarks yet: add a BenchmarkCheck to its check_test.go, like examples/todo's" >&2; exit 2
fi
flags=(-run NoTest -bench . -benchmem -count 6 -benchtime 200ms)
gen() { go run -C tools/gen ./cmd/structpages-gen -C "{{config_root}}/$d" -test "$@" ./... 2> >(grep -v 'structpages-gen: warning' >&2); }
if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then (cd "$d" && go tool gsx generate -q .); fi

# In-process: each way's own test binary calls the code directly.
echo "== $name, in-process: reflect..."; reflect=$(cd "$d" && go test "${flags[@]}" .)
echo "== $name, in-process: generated..."; gen; generated=$(cd "$d" && go test -tags structpages_generated "${flags[@]}" .)
echo "== $name, in-process: tinygo..."; gen -tags tinygo
# TinyGo prints no -N CPU suffix or goos/pkg/cpu lines, and 0 for every allocs/op, so those are left out.
tinygo=$(cd "$d" && tinygo test "${flags[@]}" . | sed -E 's/[[:space:]]+0 allocs\/op//')
result=$(benchstat -ignore goos,goarch,pkg,cpu,/gomaxprocs reflect=<(echo "$reflect") generated=<(echo "$generated") tinygo=<(echo "$tinygo"))
echo "$result"

# As served, for an example serving through workers: each way started as its example:<name>:serve:<way> task serves
# it, on :8080, and timed over local HTTP by one standard Go client (CHECK_URL), so all three pay the same network
# cost. Times only: allocations would be the client's.
served() {
  if lsof -ti tcp:8080 >/dev/null; then echo "port 8080 is in use: stop what is on it first" >&2; exit 1; fi
  mise run _example "$name" "$1" >/dev/null 2>&1 &
  curl -s -o /dev/null --retry-connrefused --retry 300 --retry-delay 1 --max-time 400 http://localhost:8080/ ||
    { echo "$d, $1: the server never answered" >&2; exit 1; }
  (cd "$d" && CHECK_URL=http://localhost:8080 go test -run NoTest -bench . -count 6 -benchtime 200ms .)
  lsof -ti tcp:8080 | xargs kill 2>/dev/null || true
  wait 2>/dev/null || true
  while lsof -ti tcp:8080 >/dev/null; do sleep 0.2; done
}
if [ "$d" = . ]; then
  served_result="(the library is no app: nothing to serve)"
elif grep -q 'structpages/workers ' "$d/go.mod"; then
  echo "== $name, served: reflect..."; s_reflect=$(served reflect)
  echo "== $name, served: generated..."; s_generated=$(served generated)
  echo "== $name, served: tinygo, in workerd..."; s_tinygo=$(served tinygo)
  wasm="$(du -k "$d/worker.generated/app.wasm" | cut -f1) KB of"
  served_result=$(benchstat -ignore goos,goarch,pkg,cpu,/gomaxprocs reflect=<(echo "$s_reflect") generated=<(echo "$s_generated") tinygo=<(echo "$s_tinygo"))
  echo "$served_result"
else
  served_result="(not served: $d doesn't serve through the workers module yet)"
fi

# Before the file is written: writing it would count as an uncommitted change.
stamp="Commit $(git rev-parse --short HEAD)$(git diff --quiet HEAD -- . ":!$d/BENCH_GENERATED.md" || echo ' + uncommitted changes'), $(date -u +%Y-%m-%dT%H:%MZ)."
cat > "$d/BENCH_GENERATED.md" <<EOT
<!-- Generated by \`mise run $([ "$d" = . ] && echo bench || echo "example:$name:bench")\`. Do not edit: run it again. -->

# $name: benchmarks, three ways

- reflect: standard Go, structpages reading methods through reflect
- generated: standard Go, reading generated code instead (-tags structpages_generated)
- tinygo: TinyGo, which reads the generated code too

$stamp
$(go version | cut -d' ' -f3-), $(tinygo version | cut -d' ' -f3-4), $(echo "$reflect" | sed -n 's/^cpu: //p'), workerd $(workerd --version 2>/dev/null | cut -d' ' -f2).
6 runs of 200ms each.

## In-process

Each way's test binary calls the code directly (TinyGo's natively, and it reports no allocs/op).

\`\`\`
$result
\`\`\`

## As served

Each way served on :8080 as its example:$name:serve:<way> task serves it (tinygo: ${wasm:-no} WebAssembly in workerd,
what Cloudflare runs), timed over local HTTP by one standard Go client, so all three pay the same network cost.

\`\`\`
$served_result
\`\`\`
EOT
echo "wrote $d/BENCH_GENERATED.md"
'''

# ---- What upstream's CI checks, on standard Go --------------------------------------------------------------------

[tasks."ci:go"]
description = """Everything CI checks on standard Go: fmt, vet, lint, then the library and every example built and \
tested the reflect way, with structpages-check, as test and examples do."""
depends = ["fmt", "vet", "lint"]
quiet = true
run = "go run -C tools/check/cmd/structpages-check . -C {{config_root}} test -ways reflect . examples/..."

[tasks.fmt]
description = "Fail if any file needs gofmt (CI's Format job)."
run = 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'

[tasks.vet]
description = "go vet on the library, workers, tools/gen, tools/check and tools/workers (CI's Format job)."
run = ["go vet ./...", "go vet -C tools/gen ./...", "go vet -C tools/check ./...", "go vet -C workers ./...", "go vet -C tools/workers ./...", "go vet -C tools/check/cmd/structpages-check ./..."]

[tasks.lint]
description = "golangci-lint on the library, workers, tools/gen, tools/check and tools/workers (CI's Lint job)."
run = [
  "golangci-lint run --timeout=5m",
  "cd tools/gen && golangci-lint run --timeout=5m",
  "cd tools/check && golangci-lint run --timeout=5m",
  "cd workers && golangci-lint run --timeout=5m",
  "cd tools/workers && golangci-lint run --timeout=5m",
  "cd tools/check/cmd/structpages-check && golangci-lint run --timeout=5m",
]
