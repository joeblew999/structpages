[tasks."example:url-validation:build"]
description = "url-validation: build it all three ways."
depends = ["example:url-validation:build:dynamic", "example:url-validation:build:static", "example:url-validation:build:static-worker"]

# The bench tasks time one way at a time, after every build: wait_for waits for a task only if it is running, so
