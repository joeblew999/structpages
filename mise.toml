# Local dev setup for this fork's tinygo branch (upstream has no mise file); versions follow
# .github/workflows/ci.yml. `mise tasks` lists everything.
#
# structpages runs three ways, and most tasks come in threes:
#   reflect    standard Go; structpages reads the app's methods through reflect (the default)
#   generated  standard Go, -tags structpages_tables: it reads code structpages-gen generates instead
#   tinygo     TinyGo, which always reads the generated code
# Everything generated is named *.generated* and gitignored (mise run clean:generated deletes it).

[tools]
go = "1.26"
tinygo = "0.43.0"
"aqua:WebAssembly/binaryen" = "133" # wasm-opt, for TinyGo's WebAssembly builds
workerd = "1.20261019.1"            # Cloudflare's Workers runtime, to serve TinyGo builds locally
golangci-lint = "2"
"go:golang.org/x/perf/cmd/benchstat" = "latest"

# ---- The library: its test suite three ways ---------------------------------------------------------------------

[tasks.test]
description = "The library's tests, reflect, with the race detector (CI's Test job)."
run = "go test -race ./..."

[tasks."test:generated"]
description = "The library's tests, generated: generate the code, then test reading it instead of reflect (CI's Tables build)."
run = [
  "go run -C tools/gen ./cmd/structpages-gen -C {{config_root}} -test ./...",
  "go test -tags structpages_tables ./...",
]

[tasks."test:tinygo"]
description = """The library's tests, tinygo, via scripts/tinygo-test.sh (CI's TinyGo job), then what TinyGo still \
skips, and why (mostly routing: tinygo-org/net#55)."""
shell = "bash -c"
run = '''
out=$(scripts/tinygo-test.sh -v 2>&1); code=$?
grep -E '^(ok|FAIL)[[:space:]]' <<<"$out"
# A skipped test's reason is its first log line, printed after its "=== RUN".
skips=$(awk '/^=== RUN/ { cur = $3; next }
  /^[[:space:]]*--- SKIP: / { print "  " $3 ": " why[$3]; next }
  cur != "" && !(cur in why) && !/^[[:space:]]*--- / && !/^(PASS|FAIL|ok)/ { l = $0; sub(/^[[:space:]]+/, "", l); why[cur] = l }' <<<"$out")
echo; echo "TinyGo skips $(grep -c . <<<"$skips") tests:"; echo "$skips"
if [ $code -ne 0 ]; then echo; grep -A12 -E '^[[:space:]]*--- FAIL' <<<"$out" | head -60; fi
exit $code
'''

[tasks."test:servemux"]
description = """servemux/'s tests (Go 1.26's ServeMux, which TinyGo apps mount on), with Go, including that it answers \
like net/http's, and under TinyGo."""
dir = "servemux"
run = ["go test -count=1 ./...", "tinygo test ./..."]

# ---- The examples: tested three ways, and served three ways -----------------------------------------------------
#
# An example's check_test.go crawls its app (tools/check) and compares every response with
# testdata/check.generated.txt, recorded from reflect. lint-misuse is a linter fixture: its tests check the linter.

[tasks.examples]
description = """Every example's tests three ways (reflect, generated, tinygo), one line each, then the first \
difference of each failure. "no tests" marks an example with none yet. One example: example:<name>:test."""
quiet = true
run = '''
fail=0
for d in examples/*/; do
  name=$(basename "$d")
  [ "$name" = lint-misuse ] && continue
  mise run _test "$name" || fail=1
done
exit $fail
'''

[tasks._test]
description = "examples/<name>'s tests three ways, on one line, then the first difference of each failure."
hide = true
quiet = true
shell = "bash -c"
usage = '''arg "<name>" help="the example's folder under examples/"'''
run = '''
d="examples/$usage_name"; fail=0; report=""; row=""
gen() { go run -C tools/gen ./cmd/structpages-gen -C "{{config_root}}/$d" -test "$@" ./... 2> >(grep -v 'structpages-gen: warning' >&2); }
if [ -z "$(find "$d" -name '*_test.go' -print -quit)" ]; then printf '%-20s no tests\n' "$usage_name"; exit 0; fi
if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then (cd "$d" && go tool gsx generate -q .); fi
for way in reflect generated tinygo; do
  case $way in
    reflect) cmd=(go test -count=1 ./...) ;;
    generated) gen; cmd=(go test -count=1 -tags structpages_tables ./...) ;;
    tinygo) gen -tags tinygo; cmd=(tinygo test ./...) ;;
  esac
  if out=$(cd "$d" && "${cmd[@]}" 2>&1); then
    row+=$(printf '%-18s' "$way: pass")
  else
    row+=$(printf '%-18s' "$way: FAIL"); fail=1
    report+=$'\n'"== $usage_name, $way:"$'\n'"$(grep -vE '^(FAIL|ok|\?)' <<<"$out" | head -14)"$'\n'
  fi
done
printf '%-20s %s\n' "$usage_name" "$row"
if [ -n "$report" ]; then echo "$report"; fi
exit $fail
'''

[tasks."examples:record"]
description = """Record every example's check (testdata/check.generated.txt) from reflect: the reference the other two \
ways are compared with. Review the diff before committing it."""
run = '''
for d in examples/*/; do
  [ -f "$d/check_test.go" ] || continue
  if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then (cd "$d" && go tool gsx generate -q .); fi
  (cd "$d" && CHECK_UPDATE=1 go test -count=1 -run TestCheck .) || exit 1
done
git status --short -- examples
'''

[tasks."test:examples"]
description = "Every example rebuilt from fresh gsx output, built and tested, reflect (CI's Example jobs)."
run = '''
for d in examples/*/; do
  echo "== $d"
  if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then
    (cd "$d" && go tool gsx generate -q -no-cache .) || exit 1
  fi
  (cd "$d" && go build -o /dev/null ./... && go test ./...) || exit 1
done
'''

# Serving, on http://localhost:8080 until Ctrl-C: example:<name> (reflect), example:<name>:generated, and
# example:<name>:tinygo, which builds it as WebAssembly into examples/<name>/worker.generated/ and runs it in
# workerd. A TinyGo build can't listen on a socket, so tinygo needs the example's serve_js.go (todo has it).

[tasks._example]
description = "Serve examples/<name> on :8080, reflect, generated or tinygo."
hide = true
raw = true
quiet = true
usage = '''
arg "<name>" help="the example's folder under examples/"
arg "[way]" help="reflect, generated or tinygo" default="reflect"
'''
run = '''
set -eu
cd "examples/$usage_name"
if grep -q 'gsxhq/gsx/cmd/gsx' go.mod; then go tool gsx generate -q .; fi
gen() { go run -C "{{config_root}}/tools/gen" ./cmd/structpages-gen -C "$PWD" "$@" ./...; }
listgen() { find . -name 'structpages_tables*.generated*.go' | sed 's|^\./|  |'; }
case "$usage_way" in
reflect)
  echo "examples/$usage_name, reflect: http://localhost:8080. Ctrl-C stops it."
  exec go run . ;;
generated)
  gen
  echo "examples/$usage_name, generated: http://localhost:8080, reading this generated code instead of reflect:"
  listgen; echo "Ctrl-C stops it."
  exec go run -tags structpages_tables . ;;
tinygo)
  if [ ! -f serve_js.go ]; then
    echo "examples/$usage_name can't run under TinyGo yet: it needs a serve_js.go like examples/todo's" >&2; exit 2
  fi
  gen -tags tinygo
  out=worker.generated; rm -rf "$out"; mkdir -p "$out"
  go run "github.com/syumai/workers-go/cmd/workers-assets-gen@$(go list -m github.com/syumai/workers-go | cut -d' ' -f2)" -mode tinygo -o "$out"
  tinygo build -o "$out/app.wasm" -target wasm -no-debug .
  cat > "$out/config.capnp" <<'EOF'
# Generated by mise run example:<name>:tinygo. Do not edit.
using Workerd = import "/workerd/workerd.capnp";

const config :Workerd.Config = (
  services = [(name = "app", worker = .app)],
  sockets = [(name = "http", address = "*:8080", http = (), service = "app")],
);

const app :Workerd.Worker = (
  modules = [
    (name = "worker.mjs", esModule = embed "worker.mjs"),
    (name = "runtime.mjs", esModule = embed "runtime.mjs"),
    (name = "wasm_exec.js", esModule = embed "wasm_exec.js"),
    (name = "app.wasm", wasm = embed "app.wasm"),
  ],
  compatibilityDate = "2026-10-01",
);
EOF
  echo "examples/$usage_name, tinygo: http://localhost:8080, $(du -k "$out/app.wasm" | cut -f1) KB of WebAssembly in workerd,"
  echo "reading this generated code:"; listgen; echo "Ctrl-C stops it."
  exec workerd serve "$out/config.capnp" ;;
*) echo "the way is reflect, generated or tinygo, not $usage_way" >&2; exit 2 ;;
esac
'''

[tasks."example:blog"]
description = "Serve examples/blog on :8080, reflect."
raw = true
quiet = true
run = "mise run _example blog"

[tasks."example:blog:generated"]
description = "Serve examples/blog on :8080, generated."
