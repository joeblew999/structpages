# ---- The repo's two tools, over every example -------------------------------------------------------------------

[tasks."gen:examples"]
description = """structpages-gen (tools/gen) over every example: regenerates gsx output, then writes \
structpages_tables.generated.go into each package with pages, and lists what it wrote."""
run = '''
fail=0
for d in examples/*/; do
  echo "== $d"
  if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then
    (cd "$d" && go tool gsx generate -q .) || fail=1
  fi
  go run -C tools/gen ./cmd/structpages-gen -C "{{config_root}}/$d" ./... || fail=1
  find "$d" -name 'structpages_tables*.generated*.go' | sed 's/^/   generated: /'
done
exit $fail
'''

[tasks."lint:examples"]
description = "structpages-lint (tools/lint) over every example but lint-misuse, whose misuses are deliberate."
dir = "tools/lint"
run = '''
fail=0
for d in ../../examples/*/; do
  case "$d" in */lint-misuse/) continue ;; esac
  echo "== $d"
  # The linter loads packages from its working directory, so -exec starts it in the example's.
  go run -exec "sh -c 'cd $d && exec \"\$@\"' sh" ./cmd/structpages-lint ./... || fail=1
done
exit $fail
'''

[tasks."clean:generated"]
description = "Delete everything generated: the structpages_tables*.generated*.go files and the examples' worker.generated/."
run = [
  "find . -name 'structpages_tables*.generated*.go' -not -path './.git/*' -print -delete | sed 's/^/deleted /'",
  "find examples -type d -name worker.generated -prune -print -exec rm -rf {} + | sed 's/^/deleted /'",
]

# ---- Benchmarks, three ways ---------------------------------------------------------------------------------------

[tasks.bench]
description = "The library's benchmarks, reflect (PERFORMANCE.md)."
run = "go test -run NoTest -bench . -benchmem ."

[tasks."bench:compare"]
description = """The library's benchmarks three ways, compared with benchstat, into BENCH-COMPARE.GENERATED.md. \
BENCH picks benchmarks (default all), COUNT the runs of each (default 6), BENCHTIME each run's length (default 200ms)."""
shell = "bash -c"
run = '''
set -euo pipefail
flags=(-run NoTest -bench "${BENCH:-.}" -benchmem -count "${COUNT:-6}" -benchtime "${BENCHTIME:-200ms}")
quiet() { "$@" 2> >(grep -v 'structpages-gen: warning' >&2); }
echo "running reflect..."; reflect=$(go test "${flags[@]}" .)
echo "running generated..."; quiet go run -C tools/gen ./cmd/structpages-gen -C {{config_root}} -test ./...
generated=$(go test -tags structpages_tables "${flags[@]}" .)
# TinyGo prints no -N CPU suffix or goos/pkg/cpu lines, and 0 for every allocs/op, so those are left out.
echo "running tinygo..."; tinygo=$(quiet scripts/tinygo-test.sh "${flags[@]}" | sed -E 's/[[:space:]]+0 allocs\/op//')
result=$(benchstat -ignore goos,goarch,pkg,cpu,/gomaxprocs reflect=<(echo "$reflect") generated=<(echo "$generated") tinygo=<(echo "$tinygo"))
echo "$result"
cat > BENCH-COMPARE.GENERATED.md <<EOF
<!-- Generated by \`mise run bench:compare\`. Do not edit: run it again. -->

# Benchmark comparison: the library

- reflect: standard Go, structpages reading methods through reflect
- generated: standard Go, reading generated code instead (-tags structpages_tables)
- tinygo: TinyGo, which reads the generated code too; it reports no allocs/op

Commit $(git rev-parse --short HEAD)$(git diff --quiet HEAD || echo ' + uncommitted changes'), $(date -u +%Y-%m-%dT%H:%MZ).
$(go version | cut -d' ' -f3-), $(tinygo version | cut -d' ' -f3-4), $(echo "$reflect" | sed -n 's/^cpu: //p').
BENCH=${BENCH:-.} COUNT=${COUNT:-6} BENCHTIME=${BENCHTIME:-200ms}.

\`\`\`
$result
\`\`\`
EOF
echo "wrote BENCH-COMPARE.GENERATED.md"
'''

[tasks."bench:examples"]
description = """Every example's BenchmarkCheck (its recorded GETs) three ways, compared with benchstat, into \
BENCH-EXAMPLES.GENERATED.md. COUNT the runs of each (default 6), BENCHTIME each run's length (default 200ms)."""
shell = "bash -c"
run = '''
set -euo pipefail
flags=(-run NoTest -bench BenchmarkCheck -benchmem -count "${COUNT:-6}" -benchtime "${BENCHTIME:-200ms}")
gen() { go run -C tools/gen ./cmd/structpages-gen -C "{{config_root}}/$d" -test "$@" ./... 2> >(grep -v 'structpages-gen: warning' >&2); }
sections=""
for d in examples/*/; do
  grep -qs 'func BenchmarkCheck' "$d/check_test.go" || continue
  name=$(basename "$d")
  if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then (cd "$d" && go tool gsx generate -q .); fi
  echo "== $name: reflect..."; reflect=$(cd "$d" && go test "${flags[@]}" .)
  echo "== $name: generated..."; gen; generated=$(cd "$d" && go test -tags structpages_tables "${flags[@]}" .)
  echo "== $name: tinygo..."; gen -tags tinygo
  tinygo=$(cd "$d" && tinygo test "${flags[@]}" . | sed -E 's/[[:space:]]+0 allocs\/op//')
  result=$(benchstat -ignore goos,goarch,pkg,cpu,/gomaxprocs reflect=<(echo "$reflect") generated=<(echo "$generated") tinygo=<(echo "$tinygo"))
  echo "$result"
  sections+=$'\n'"## $name"$'\n\n```\n'"$result"$'\n```\n'
done
cat > BENCH-EXAMPLES.GENERATED.md <<EOF
<!-- Generated by \`mise run bench:examples\`. Do not edit: run it again. -->

# Benchmark comparison: the examples

Each example's BenchmarkCheck times the GETs its check recorded (tools/check), three ways: reflect,
generated (-tags structpages_tables) and tinygo (which reports no allocs/op).

Commit $(git rev-parse --short HEAD)$(git diff --quiet HEAD || echo ' + uncommitted changes'), $(date -u +%Y-%m-%dT%H:%MZ).
$(go version | cut -d' ' -f3-), $(tinygo version | cut -d' ' -f3-4). COUNT=${COUNT:-6} BENCHTIME=${BENCHTIME:-200ms}.
$sections
EOF
echo "wrote BENCH-EXAMPLES.GENERATED.md"
'''

# ---- What upstream's CI checks, on standard Go --------------------------------------------------------------------

[tasks."ci:go"]
description = "Everything CI checks on standard Go: test, fmt, vet, lint, test:examples."
depends = ["test", "fmt", "vet", "lint", "test:examples"]

[tasks.fmt]
description = "Fail if any file needs gofmt (CI's Format job)."
run = 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'

[tasks.vet]
description = "go vet on the library, tools/gen and tools/check (CI's Format job)."
run = ["go vet ./...", "go vet -C tools/gen ./...", "go vet -C tools/check ./..."]

[tasks.lint]
description = "golangci-lint on the library, tools/gen and tools/check (CI's Lint job)."
run = [
  "golangci-lint run --timeout=5m",
  "cd tools/gen && golangci-lint run --timeout=5m",
  "cd tools/check && golangci-lint run --timeout=5m",
]
