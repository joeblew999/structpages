# Local dev setup for this fork's tinygo branch (upstream has no mise file); versions follow
# .github/workflows/ci.yml. `mise tasks` lists everything.
#
# structpages runs three ways, and most tasks come in threes:
#   reflect    standard Go; structpages reads the app's methods through reflect (the default)
#   generated  standard Go, -tags structpages_generated: it reads code structpages-gen generates instead
#   tinygo     TinyGo, which always reads the generated code
#
# THE ORDER. Some files are made from others, so an example's steps run in an order, each reading what the one
# before wrote: 1 gsx (.gsx -> .x.go), 2 gen (structpages-gen -> structpages.generated.go), 3 record (the e2e test
# from the reflect build -> testdata/e2e.generated.txt), 4 test, bench or serve (structpages-dev). examples/todo's
# section below has each step as its own task (generate:gsx, generate:structpages-gen, generate:e2e, then test, bench,
# serve), each depending on the one before. The other examples' generate tasks
# do their steps 1 and 2 in order until they get todo's shape.
#
# What generate makes is committed for the examples, as upstream commits .x.go: commit it with the code it comes
# from (generated:check, and so ci:go, fails until you have). A change to testdata/e2e.generated.txt is a change in
# what the app answers: review its diff. The library's generated files are for its own tests only and gitignored.
# A task over several folders lists them, a line each.

[tools]
go = "1.26"
tinygo = "0.43.0"
"aqua:WebAssembly/binaryen" = "133" # wasm-opt, for TinyGo's WebAssembly builds
workerd = "1.20261019.1"            # Cloudflare's Workers runtime, to serve TinyGo builds locally
golangci-lint = "2"
"go:golang.org/x/perf/cmd/benchstat" = "latest"

[vars]
# structpages-dev from this repository, working in its root; the folder and what to do follow.
dev = "go run -C tools/dev ./cmd/structpages-dev -C {{config_root}}"
# structpages-gen from this repository (step 2); -C, the folder, follows.
gen = "go run -C tools/gen ./cmd/structpages-gen"

# ---- Generate: each folder's generated files, in THE ORDER above ---------------------------------------------------

[tasks.generate]
description = """The library's generated files (step 2), for its own tests' generated and tinygo builds: gitignored. \
test, bench, vet and lint run it first."""
run = "{{vars.gen}} -C {{config_root}} -test ./..."

[tasks."examples:generate"]
description = "Every example's generate task: each example's generated files, in order."
depends = [
  "example:blog:generate",
  "example:html-template:generate",
  "example:htmx:generate",
  "example:htmx-render-target:generate",
  "example:lint-misuse:generate",
  "example:simple:generate",
  "example:todo:generate",
  "example:url-validation:generate",
]

[tasks."example:blog:generate"]
description = "examples/blog's generated files, in order: .x.go, then structpages.generated.go. Commit what changes."
run = [
  "go -C examples/blog tool gsx generate -q -no-cache .",      # 1. .gsx -> .x.go
  "{{vars.gen}} -C {{config_root}}/examples/blog -test ./...", # 2. -> structpages.generated.go
]

[tasks."example:html-template:generate"]
description = "examples/html-template's generated file: structpages.generated.go (it uses no gsx, and has no e2e test yet). Commit what changes."
run = [
  "{{vars.gen}} -C {{config_root}}/examples/html-template -test ./...", # 2. -> structpages.generated.go
]

[tasks."example:htmx:generate"]
description = "examples/htmx's generated files, in order: .x.go, then structpages.generated.go. Commit what changes."
run = [
  "go -C examples/htmx tool gsx generate -q -no-cache .",      # 1. .gsx -> .x.go
  "{{vars.gen}} -C {{config_root}}/examples/htmx -test ./...", # 2. -> structpages.generated.go
]

[tasks."example:htmx-render-target:generate"]
description = "examples/htmx-render-target's generated files, in order: .x.go, then structpages.generated.go. Commit what changes."
run = [
  "go -C examples/htmx-render-target tool gsx generate -q -no-cache .",      # 1. .gsx -> .x.go
  "{{vars.gen}} -C {{config_root}}/examples/htmx-render-target -test ./...", # 2. -> structpages.generated.go
]

[tasks."example:lint-misuse:generate"]
description = "examples/lint-misuse's generated files, in order: .x.go, then structpages.generated.go. Commit what changes. Never built the generated way (its tests check the linter), but made like every example's."
run = [
  "go -C examples/lint-misuse tool gsx generate -q -no-cache .",      # 1. .gsx -> .x.go
  "{{vars.gen}} -C {{config_root}}/examples/lint-misuse -test ./...", # 2. -> structpages.generated.go
]

[tasks."example:simple:generate"]
description = "examples/simple's generated files, in order: .x.go, then structpages.generated.go. Commit what changes."
run = [
  "go -C examples/simple tool gsx generate -q -no-cache .",      # 1. .gsx -> .x.go
  "{{vars.gen}} -C {{config_root}}/examples/simple -test ./...", # 2. -> structpages.generated.go
]

[tasks."example:url-validation:generate"]
description = "examples/url-validation's generated file: structpages.generated.go (it uses no gsx, and has no e2e test yet). Commit what changes."
run = [
  "{{vars.gen}} -C {{config_root}}/examples/url-validation -test ./...", # 2. -> structpages.generated.go
]

[tasks."generated:check"]
description = """Every generate task, then fail if a generated file the examples commit (.x.go, \
structpages.generated.go, testdata/e2e.generated.txt) changed or is new and isn't added to git: commit it with the code \
it comes from. CI checks the same on a fresh checkout."""
depends = ["generate", "examples:generate"]
run = '''
changed=$(git status --porcelain --untracked-files=all -- '*.x.go' '*.generated.go' '*.generated_test.go' '*.generated.txt' | grep '^.[^ ]' || true)
if [ -n "$changed" ]; then
  echo "These generated files changed and aren't added to git: commit them with the code they come from."
  echo "$changed"
  exit 1
fi
echo "Every generated file is committed."
'''

# ---- examples/todo: its tasks, one per step, in the order they run -----------------------------------------------
#
# Each task runs in examples/todo and depends on the one before it, so running one runs the steps before it first:
#   generate:gsx -> generate:structpages-gen -> generate:e2e -> test, bench, or serve:reflect / :generated / :tinygo
# `mise tasks deps example:todo:test` prints the chain.

[tasks."example:todo:generate:gsx"]
description = "todo: gsx makes the .x.go files."
dir = "examples/todo"
run = "go tool gsx generate"

[tasks."example:todo:generate:structpages-gen"]
description = "todo: structpages-gen makes structpages.generated.go."
depends = ["example:todo:generate:gsx"]
dir = "examples/todo"
run = "go tool structpages-gen"

[tasks."example:todo:generate:e2e"]
description = "todo: the e2e test records todo's answers into testdata/e2e.generated.txt."
depends = ["example:todo:generate:structpages-gen"]
dir = "examples/todo"
run = "go test -update"

[tasks."example:todo:generate"]
description = "todo: all three generate tasks."
depends = ["example:todo:generate:e2e"]

[tasks."example:todo:test"]
description = "examples/todo, step 4: build and test it three ways (reflect, generated, tinygo), a line each."
depends = ["example:todo:generate"]
quiet = true
run = "go run -C tools/dev ./cmd/structpages-dev -C {{config_root}} test examples/todo"

[tasks."example:todo:bench"]
description = "examples/todo, step 4: its benchmarks three ways, in-process and as served, into examples/todo/BENCH_GENERATED.md."
depends = ["example:todo:generate"]
quiet = true
run = "go run -C tools/dev ./cmd/structpages-dev -C {{config_root}} bench examples/todo"

[tasks."example:todo:serve:reflect"]
description = "examples/todo, step 4: serve it on :8080 until Ctrl-C, reflect."
depends = ["example:todo:generate"]
raw = true
quiet = true
run = "go run -C tools/dev ./cmd/structpages-dev -C {{config_root}} serve examples/todo reflect"

[tasks."example:todo:serve:generated"]
description = "examples/todo, step 4: serve it on :8080 until Ctrl-C, generated."
depends = ["example:todo:generate"]
raw = true
quiet = true
run = "go run -C tools/dev ./cmd/structpages-dev -C {{config_root}} serve examples/todo generated"

[tasks."example:todo:serve:tinygo"]
description = "examples/todo, step 4: serve it on :8080 until Ctrl-C, tinygo: WebAssembly in workerd."
depends = ["example:todo:generate"]
raw = true
quiet = true
run = "go run -C tools/dev ./cmd/structpages-dev -C {{config_root}} serve examples/todo tinygo"

# ---- Tests, three ways: the library and each example, the same way -------------------------------------------------
#
# An example's e2e_test.go crawls its app (the e2e package) and compares every response with
# testdata/e2e.generated.txt, recorded from reflect in its generate task. lint-misuse is a linter fixture: its tests
# check the linter.

[tasks.test]
description = """The library's tests three ways (reflect and generated with the race detector, which TinyGo lacks): \
a line with how many passed each way, then every test skipped, with why, and the first lines of any failure."""
depends = ["generate"]
quiet = true
run = "{{vars.dev}} test ."

[tasks.examples]
description = """Every example's tests three ways, as test does for the library: a line each, and "no tests" for an \
example with none yet. examples/todo alone: example:todo:test."""
depends = ["examples:generate"]
quiet = true
run = [
  "{{vars.dev}} test examples/blog",
  "{{vars.dev}} test examples/html-template",
  "{{vars.dev}} test examples/htmx",
  "{{vars.dev}} test examples/htmx-render-target",
  "{{vars.dev}} test examples/simple",
  "{{vars.dev}} test examples/todo",
  "{{vars.dev}} test examples/url-validation",
]

# ---- Serving an example on http://localhost:8080 until Ctrl-C, each way --------------------------------------------
#
# Under tinygo the app is WebAssembly in workerd, for an example that serves through workers.Serve, as todo does
# (a TinyGo build can't listen on a socket): structpages-dev builds it into a temporary folder (workers-go's glue,
# structpages-workers' worker.mjs and config.capnp, then tinygo build) and Ctrl-C deletes it.

[tasks."example:blog:serve:reflect"]
description = "Serve examples/blog on :8080, reflect."
depends = ["example:blog:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/blog reflect"

[tasks."example:blog:serve:generated"]
description = "Serve examples/blog on :8080, generated."
depends = ["example:blog:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/blog generated"

[tasks."example:html-template:serve:reflect"]
description = "Serve examples/html-template on :8080, reflect."
depends = ["example:html-template:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/html-template reflect"

[tasks."example:html-template:serve:generated"]
description = "Serve examples/html-template on :8080, generated."
depends = ["example:html-template:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/html-template generated"

[tasks."example:htmx:serve:reflect"]
description = "Serve examples/htmx on :8080, reflect."
depends = ["example:htmx:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/htmx reflect"

[tasks."example:htmx:serve:generated"]
description = "Serve examples/htmx on :8080, generated."
depends = ["example:htmx:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/htmx generated"

[tasks."example:htmx-render-target:serve:reflect"]
description = "Serve examples/htmx-render-target on :8080, reflect."
depends = ["example:htmx-render-target:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/htmx-render-target reflect"

[tasks."example:htmx-render-target:serve:generated"]
description = "Serve examples/htmx-render-target on :8080, generated."
depends = ["example:htmx-render-target:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/htmx-render-target generated"

[tasks."example:simple:serve:reflect"]
description = "Serve examples/simple on :8080, reflect."
depends = ["example:simple:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/simple reflect"

[tasks."example:simple:serve:generated"]
description = "Serve examples/simple on :8080, generated."
depends = ["example:simple:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/simple generated"

[tasks."example:url-validation:serve:reflect"]
description = "Serve examples/url-validation on :8080, reflect."
depends = ["example:url-validation:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/url-validation reflect"

[tasks."example:url-validation:serve:generated"]
description = "Serve examples/url-validation on :8080, generated."
depends = ["example:url-validation:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/url-validation generated"

# ---- Benchmarks, three ways: the library and each example, the same way --------------------------------------------

[tasks.bench]
description = """The library's benchmarks three ways (6 runs of 200ms each), compared with benchstat, into \
BENCH_GENERATED.md."""
depends = ["generate"]
quiet = true
run = "{{vars.dev}} bench ."

[tasks."bench:examples"]
description = """Every example with benchmarks (examples/todo, so far), three ways, in-process and as served, each into \
its own BENCH_GENERATED.md, as bench does for the library. examples/todo alone: example:todo:bench."""
depends = ["example:todo:generate"]
quiet = true
run = [
  "{{vars.dev}} bench examples/todo",
]

# ---- structpages-lint (tools/lint) over every example ----------------------------------------------------------------

[tasks."lint:examples"]
description = "structpages-lint (tools/lint) over every example but lint-misuse, whose misuses are deliberate."
depends = ["examples:generate"]
dir = "tools/lint"
run = '''
fail=0
for d in ../../examples/*/; do
  case "$d" in */lint-misuse/) continue ;; esac
  echo "== $d"
  # The linter loads packages from its working directory, so -exec starts it in the example's.
  go run -exec "sh -c 'cd $d && exec \"\$@\"' sh" ./cmd/structpages-lint ./... || fail=1
done
exit $fail
'''

# ---- What upstream's CI checks, on standard Go --------------------------------------------------------------------

[tasks."ci:go"]
description = """Everything CI checks on standard Go: fmt, vet, lint, generated:check, then the library and every \
example built and tested the reflect way, as test and examples do."""
depends = ["fmt", "vet", "lint", "generated:check"]
quiet = true
run = [
  "{{vars.dev}} test -ways reflect .",
  "{{vars.dev}} test -ways reflect examples/blog",
  "{{vars.dev}} test -ways reflect examples/html-template",
  "{{vars.dev}} test -ways reflect examples/htmx",
  "{{vars.dev}} test -ways reflect examples/htmx-render-target",
  "{{vars.dev}} test -ways reflect examples/lint-misuse",
  "{{vars.dev}} test -ways reflect examples/simple",
  "{{vars.dev}} test -ways reflect examples/todo",
  "{{vars.dev}} test -ways reflect examples/url-validation",
]

[tasks.fmt]
description = "Fail if any file needs gofmt (CI's Format job)."
wait_for = ["generate", "examples:generate"] # not while they write files, when ci:go runs them too
run = 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'

# vet and lint check each module, and again with the build tags that pick other files: the library's generated and
# tinygo files (e2e's among them, and the library's generated test files, so they run after generate) and the workers
# module's js/wasm one, which TinyGo builds.
[tasks.vet]
depends = ["generate"]
description = "go vet on the library, workers, tools/gen, tools/dev and tools/workers, each build too (CI's Format job)."
run = [
  "go vet ./...",
  "go vet -tags structpages_generated ./...",
  "go vet -tags tinygo ./...",
  "go vet -C workers ./...",
  "GOOS=js GOARCH=wasm go vet -C workers ./...",
  "go vet -C tools/gen ./...",
  "go vet -C tools/dev ./...",
  "go vet -C tools/workers ./...",
]

[tasks.lint]
depends = ["generate"]
description = "golangci-lint on the library, workers, tools/gen, tools/dev and tools/workers, each build too (CI's Lint job)."
run = [
  "golangci-lint run --timeout=5m",
  "golangci-lint run --timeout=5m --build-tags structpages_generated",
  "golangci-lint run --timeout=5m --build-tags tinygo",
  "cd workers && golangci-lint run --timeout=5m",
  "cd workers && GOOS=js GOARCH=wasm golangci-lint run --timeout=5m",
  "cd tools/gen && golangci-lint run --timeout=5m",
  "cd tools/dev && golangci-lint run --timeout=5m",
  "cd tools/workers && golangci-lint run --timeout=5m",
]
