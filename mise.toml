# ---- Tests, three ways: the library and each example, the same way -------------------------------------------------
#
# An example's e2e_test.go crawls its app (the e2e package) and compares every response with
# testdata/e2e.generated.txt, recorded from the dynamic build in its generate task. lint-misuse is a linter fixture: its tests
# check the linter.

[tasks.test]
description = """The library's tests three ways (dynamic and static with the race detector, which TinyGo lacks): \
a line with how many passed each way, then every test skipped, with why, and the first lines of any failure."""
depends = ["generate"]
quiet = true
run = "{{vars.dev}} test ."

[tasks.examples]
description = """Every example's tests three ways, as test does for the library: a line each, and "no tests" for an \
example with none yet. examples/todo alone: example:todo:test."""
depends = ["example:htmx:test", "example:htmx-render-target:test", "example:simple:test", "example:todo:test", "example:url-validation:test", "examples:generate"]
quiet = true
run = [
  "{{vars.dev}} test examples/blog",
  "{{vars.dev}} test examples/html-template",
]

