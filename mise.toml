#     -> build:static  -> serve:static
#   build (both) -> bench:dynamic -> bench:static -> bench (the report)
# Dynamic and static only: Go's html/template calls parts of reflect TinyGo lacks ((reflect.Type).NumOut),
# so it can't run as a Worker.
# Builds go in examples/html-template/build/ (gitignored).
# `mise tasks deps example:html-template:serve:static` prints a chain.
# The serve tasks have raw = true: mise hands them the terminal, as typing the command yourself does, so the server's
# log lines show as they are, without the task's name in front of each. It changes nothing about what runs.

