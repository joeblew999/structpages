# Local dev setup for this fork's tinygo branch (upstream has no mise file); versions follow
# .github/workflows/ci.yml. `mise tasks` lists everything.
#
# structpages runs three ways, and most tasks come in threes:
#   reflect    standard Go; structpages reads the app's methods through reflect (the default)
#   generated  standard Go, -tags structpages_generated: it reads code structpages-gen generates instead
#   tinygo     TinyGo, which always reads the generated code
# Everything generated is named *.generated* and gitignored (mise run clean:generated deletes it).
#
# Most tasks run structpages-dev (tools/dev) on one folder: the library (.) or an example. It does the same steps
# every way: generate the code the way needs, build, then test, benchmark or serve, and delete what it generated
# and built. A task over several folders lists them, a line each.

[tools]
go = "1.26"
tinygo = "0.43.0"
"aqua:WebAssembly/binaryen" = "133" # wasm-opt, for TinyGo's WebAssembly builds
workerd = "1.20261019.1"            # Cloudflare's Workers runtime, to serve TinyGo builds locally
golangci-lint = "2"
"go:golang.org/x/perf/cmd/benchstat" = "latest"

[vars]
# structpages-dev from this repository, working in its root; the folder and what to do follow.
dev = "go run -C tools/dev ./cmd/structpages-dev -C {{config_root}}"

# ---- Tests, three ways: the library (the root folder) and each example, the same way ------------------------------
#
# An example's e2e_test.go crawls its app (tools/e2e) and compares every response with testdata/e2e.generated.txt,
# recorded from reflect. lint-misuse is a linter fixture: its tests check the linter.

[tasks.test]
description = """The library's tests three ways (reflect and generated with the race detector, which TinyGo lacks): \
a line with how many passed each way, then every test skipped, with why, and the first lines of any failure."""
quiet = true
run = "{{vars.dev}} test ."

[tasks.examples]
description = """Every example's tests three ways, as test does for the library: a line each, and "no tests" for an \
example with none yet. examples/todo alone: example:todo:test."""
quiet = true
run = [
  "{{vars.dev}} test examples/blog",
  "{{vars.dev}} test examples/html-template",
  "{{vars.dev}} test examples/htmx",
  "{{vars.dev}} test examples/htmx-render-target",
  "{{vars.dev}} test examples/simple",
  "{{vars.dev}} test examples/todo",
  "{{vars.dev}} test examples/url-validation",
]

[tasks."example:todo:test"]
description = "examples/todo's tests three ways: reflect, generated, tinygo."
quiet = true
run = "{{vars.dev}} test examples/todo"

[tasks."examples:record"]
description = """Record examples/todo's e2e test (testdata/e2e.generated.txt) from reflect: the reference the other two \
ways are compared with. Review the diff before committing it."""
run = [
  "go -C examples/todo tool gsx generate -q .",
  "E2E_UPDATE=1 go -C examples/todo test -count=1 -run TestE2E .",
  "git status --short -- examples/todo",
]

# ---- Serving an example on http://localhost:8080 until Ctrl-C, each way --------------------------------------------
#
# Under tinygo the app is WebAssembly in workerd, for an example that serves through workers.Serve, as todo does
# (a TinyGo build can't listen on a socket). Ctrl-C deletes what was generated and built.

[tasks."example:blog:serve:reflect"]
description = "Serve examples/blog on :8080, reflect."
raw = true
quiet = true
run = "{{vars.dev}} serve examples/blog reflect"

[tasks."example:blog:serve:generated"]
description = "Serve examples/blog on :8080, generated."
