# Local dev setup for this fork's tinygo branch (upstream has no mise file).
# Versions follow .github/workflows/ci.yml's TinyGo job.

[tools]
go = "1.26"
tinygo = "0.43.0"
"aqua:WebAssembly/binaryen" = "133" # wasm-opt, which TinyGo's WebAssembly builds need
golangci-lint = "2"
"go:golang.org/x/perf/cmd/benchstat" = "latest"

[tasks."ci:go"]
description = "Everything CI checks on the standard Go toolchain."
depends = ["test", "fmt", "vet", "lint", "test:examples"]

[tasks.test]
description = "Run the test suite on the standard Go toolchain (method reflection), with the race detector as CI does."
run = "go test -race ./..."

[tasks.parity]
description = """Run the suite on standard Go and under TinyGo and list what passes on Go but not on TinyGo: \
tests TinyGo skips (with why), fails, or never reports. Empty lists are parity."""
shell = "bash -c"
run = '''
set -euo pipefail
quiet() { "$@" 2> >(grep -v 'structpages-gen: warning' >&2); }
# "STATUS name" per test, plus "WHY name: reason" for a SKIP: the test's first log line, printed after its
# "=== RUN" (Go prefixes it with file:line, TinyGo doesn't).
results() {
  awk '/^=== RUN/ { cur = $3; next }
       /^[[:space:]]*--- (PASS|FAIL|SKIP): / { s = $2; sub(":", "", s); print s, $3; if (s == "SKIP") print "WHY", $3 ": " why[$3]; next }
       cur != "" && !($0 ~ /^(PASS|FAIL|ok|=== )/) && !(cur in why) { l = $0; sub(/^[[:space:]]+/, "", l); sub(/^[^ ]+\.go:[0-9]+: /, "", l); why[cur] = l }'
}
echo "running go..."; g=$(go test -v . ./internal/... | results)
echo "running tinygo..."; t=$(quiet scripts/tinygo-test.sh -v | results)
passed_go=$(awk '$1 == "PASS" { print $2 }' <<<"$g" | sort -u)
on_tinygo() { awk -v s="$1" '$1 == s { print $2 }' <<<"$t" | sort -u; }
echo; echo "== passes on Go, skipped on TinyGo:"
comm -12 <(echo "$passed_go") <(on_tinygo SKIP) | while read -r n; do
  grep -m1 "^WHY $n: " <<<"$t" | sed 's/^WHY //' || echo "$n"
done
echo; echo "== passes on Go, fails on TinyGo:"
comm -12 <(echo "$passed_go") <(on_tinygo FAIL)
echo; echo "== passes on Go, not reported by TinyGo (subtests of the skipped tests above left out):"
skipped=$(on_tinygo SKIP)
comm -23 <(echo "$passed_go") <(awk '{ print $2 }' <<<"$t" | sort -u) | while read -r n; do
  under_skip=0
  for s in $skipped; do [[ "$n" == "$s"/* ]] && under_skip=1 && break; done
  if [[ $under_skip == 0 ]]; then echo "$n"; fi
done
echo; echo "go: $(grep -c . <<<"$passed_go") passed; tinygo: $(on_tinygo PASS | grep -c .) passed, $(on_tinygo SKIP | grep -c .) skipped, $(on_tinygo FAIL | grep -c .) failed"
'''

[tasks.bench]
description = "Run the benchmarks on the standard Go toolchain (PERFORMANCE.md)."
run = "go test -run NoTest -bench . -benchmem ."

[tasks."bench:tables"]
description = "Run the benchmarks on standard Go reading the generated tables: TinyGo's code path, on Go's compiler. Compare with bench."
run = [
  "go run -C tools/gen ./cmd/structpages-gen -C {{config_root}} -test ./...",
  "go test -tags structpages_tables -run NoTest -bench . -benchmem .",
]

[tasks."bench:tinygo"]
description = "Run the benchmarks under TinyGo, via scripts/tinygo-test.sh. Compare with bench."
run = "scripts/tinygo-test.sh -run NoTest -bench . -benchmem"

[tasks."bench:compare"]
description = """Run bench, bench:tables and bench:tinygo one after another and compare them with benchstat: \
reflect against the generated tables on Go, and against TinyGo. Prints the comparison and writes it to \
BENCH-COMPARE.GENERATED.md. BENCH picks benchmarks (default all), COUNT the runs of each (default 6), \
BENCHTIME each run's length (default 200ms)."""
shell = "bash -c"
run = '''
set -euo pipefail
flags=(-run NoTest -bench "${BENCH:-.}" -benchmem -count "${COUNT:-6}" -benchtime "${BENCHTIME:-200ms}")
quiet() { "$@" 2> >(grep -v 'structpages-gen: warning' >&2); }
echo "running reflect..."; reflect=$(go test "${flags[@]}" .)
echo "running tables..."; quiet go run -C tools/gen ./cmd/structpages-gen -C {{config_root}} -test ./...
tables=$(go test -tags structpages_tables "${flags[@]}" .)
# TinyGo prints no -N CPU suffix or goos/pkg/cpu lines, and 0 for every allocs/op, so those are left out.
echo "running tinygo..."; tinygo=$(quiet scripts/tinygo-test.sh "${flags[@]}" | sed -E 's/[[:space:]]+0 allocs\/op//')
result=$(benchstat -ignore goos,goarch,pkg,cpu,/gomaxprocs reflect=<(echo "$reflect") tables=<(echo "$tables") tinygo=<(echo "$tinygo"))
echo "$result"
cat > BENCH-COMPARE.GENERATED.md <<EOF
<!-- Generated by \`mise run bench:compare\`. Do not edit: run it again. -->

# Benchmark comparison

- reflect: standard Go, structpages reading methods through reflect (\`mise run bench\`)
- tables: standard Go, reading the generated tables instead (\`mise run bench:tables\`)
- tinygo: TinyGo, which reads the tables (\`mise run bench:tinygo\`); it reports no allocs/op

Commit $(git rev-parse --short HEAD)$(git diff --quiet HEAD || echo ' + uncommitted changes'), $(date -u +%Y-%m-%dT%H:%MZ).
$(go version | cut -d' ' -f3-), $(tinygo version | cut -d' ' -f3-4), $(echo "$reflect" | sed -n 's/^cpu: //p').
BENCH=${BENCH:-.} COUNT=${COUNT:-6} BENCHTIME=${BENCHTIME:-200ms}.

\`\`\`
$result
\`\`\`
EOF
echo "wrote BENCH-COMPARE.GENERATED.md"
'''

[tasks.fmt]
description = "Fail if any file needs gofmt (CI's Format job)."
run = 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'

[tasks.vet]
description = "Run go vet on the library and on tools/gen, its own module (CI's Format job)."
run = ["go vet ./...", "go vet -C tools/gen ./..."]

[tasks.lint]
description = "Run golangci-lint with .golangci.yml on the library and on tools/gen (CI's Lint job)."
run = ["golangci-lint run --timeout=5m", "cd tools/gen && golangci-lint run --timeout=5m"]

[tasks."test:examples"]
description = "For each example: regenerate its gsx output, then build and test it (CI's Example jobs)."
run = '''
for d in examples/*/; do
  echo "== $d"
  if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then
    (cd "$d" && go tool gsx generate -q -no-cache .) || exit 1
  fi
  (cd "$d" && go build -o /dev/null ./... && go test ./...) || exit 1
done
'''

[tasks."test:examples:tables"]
description = """For each example: regenerate gsx output, generate its tables (its tests' too), then build and test \
it without method reflection (-tags structpages_tables). Compare with test:examples."""
run = '''
fail=0
for d in examples/*/; do
  echo "== $d"
  if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then
    (cd "$d" && go tool gsx generate -q .) || fail=1
  fi
  go run -C tools/gen ./cmd/structpages-gen -C "{{config_root}}/$d" -test ./... || fail=1
  (cd "$d" && go build -tags structpages_tables -o /dev/null ./... && go test -tags structpages_tables ./...) || fail=1
done
exit $fail
'''

[tasks."test:examples:tinygo"]
description = """For each example but lint-misuse (a linter fixture: its test runs go build): regenerate gsx output, \
generate its tables for TinyGo (its tests' too), then run its tests under TinyGo. Compare with test:examples."""
shell = "bash -c"
run = '''
fail=0
for d in examples/*/; do
  case "$d" in */lint-misuse/) continue ;; esac
  echo "== $d"
  if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then
    (cd "$d" && go tool gsx generate -q .) || fail=1
  fi
  go run -C tools/gen ./cmd/structpages-gen -C "{{config_root}}/$d" -test -tags tinygo ./... 2> >(grep -v 'structpages-gen: warning' >&2) || fail=1
  (cd "$d" && tinygo test ./...) || fail=1
done
exit $fail
'''

[tasks."build:examples:tinygo"]
description = """Build every example with TinyGo, natively and as WebAssembly (-target wasm), after generating its \
tables for TinyGo, and print each binary's size. Nothing is written to the tree."""
shell = "bash -c"
run = '''
fail=0
size() { awk 'END { printf "%d KB", $5 / 1024 }'; } # the flash column of tinygo -size short
printf '%-20s %10s %10s\n' example native wasm
for d in examples/*/; do
  if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then
    (cd "$d" && go tool gsx generate -q .) || fail=1
  fi
  go run -C tools/gen ./cmd/structpages-gen -C "{{config_root}}/$d" -tags tinygo ./... 2> >(grep -v 'structpages-gen: warning' >&2) || fail=1
  sizes=()
  for target in native wasm; do
    flags=(); [ $target = wasm ] && flags=(-target wasm)
    if out=$(cd "$d" && tinygo build "${flags[@]}" -size short -o /dev/null . 2>&1); then
      sizes+=("$(size <<<"$out")")
    else
      sizes+=(FAILED); fail=1; echo "$out" | tail -3 >&2
    fi
  done
  printf '%-20s %10s %10s\n' "$(basename "$d")" "${sizes[@]}"
done
exit $fail
'''

[tasks."clean:generated"]
description = "Delete every table structpages-gen wrote (structpages_tables*.generated*.go), in the library and the examples."
run = "find . -name 'structpages_tables*.generated*.go' -not -path './.git/*' -print -delete | sed 's/^/deleted /'"

# Each example app two ways, served on http://localhost:8080 until Ctrl-C:
#   example:<name>         the normal build: structpages reads the app's methods through reflect
#   example:<name>:tables  generated: structpages-gen writes the app's tables first, and it reads those instead
#                          (-tags structpages_tables: TinyGo's code path, on standard Go)
# The generated files only build with that tag, so both work whether they exist or not.
# lint-misuse is a linter fixture and never serves.

[tasks._example]
description = "Serve examples/<name> on :8080: with reflect, or (mode tables) from generated tables."
hide = true
raw = true
quiet = true
usage = '''
arg "<name>" help="the example's folder under examples/"
arg "[mode]" help="reflect or tables" default="reflect"
'''
run = '''
set -eu
cd "examples/$usage_name"
if grep -q 'gsxhq/gsx/cmd/gsx' go.mod; then go tool gsx generate -q .; fi
case "$usage_mode" in
reflect)
  echo "examples/$usage_name: http://localhost:8080, the normal build (methods read through reflect). Ctrl-C stops it."
  exec go run . ;;
tables)
  go run -C "{{config_root}}/tools/gen" ./cmd/structpages-gen -C "$PWD" ./...
  echo "examples/$usage_name: http://localhost:8080, reading these generated tables instead of reflect:"
  find . -name 'structpages_tables*.generated*.go' | sed 's|^\./|  |'
  echo "Ctrl-C stops it."
  exec go run -tags structpages_tables . ;;
*) echo "mode is reflect or tables, not $usage_mode" >&2; exit 2 ;;
esac
'''

[tasks."example:blog"]
description = "Serve examples/blog on :8080, the normal build (reflect)."
