depends = ["example:html-template:generate:structpages-static"]
dir = "examples/html-template"
run = "go test -update"

[tasks."example:html-template:generate"]
description = "html-template: all two generate tasks."
depends = ["example:html-template:generate:e2e"]

[tasks."example:html-template:test:dynamic"]
description = "html-template: test it, dynamic."
depends = ["example:html-template:generate", "tools:dev"]
dir = "examples/html-template"
run = "structpages-dev test dynamic"

[tasks."example:html-template:test:static"]
description = "html-template: test it, static."
depends = ["example:html-template:generate", "tools:dev"]
dir = "examples/html-template"
run = "structpages-dev test static"

[tasks."example:html-template:test"]
description = "html-template: test it both ways."
depends = ["example:html-template:test:dynamic", "example:html-template:test:static"]

[tasks."example:html-template:build:dynamic"]
description = "html-template: build it, dynamic, into build/dynamic."
depends = ["example:html-template:generate"]
dir = "examples/html-template"
run = "go build -o build/dynamic ."

[tasks."example:html-template:serve:dynamic"]
description = "html-template: serve its dynamic build on :8080 until Ctrl-C."
depends = ["example:html-template:build:dynamic", "tools:dev"]
dir = "examples/html-template"
raw = true
run = "structpages-dev serve dynamic"

[tasks."example:html-template:build:static"]
description = "html-template: build it, static, into build/static."
depends = ["example:html-template:generate"]
dir = "examples/html-template"
run = "go build -tags structpages_static -o build/static ."

[tasks."example:html-template:serve:static"]
description = "html-template: serve its static build on :8080 until Ctrl-C."
depends = ["example:html-template:build:static", "tools:dev"]
dir = "examples/html-template"
raw = true
run = "structpages-dev serve static"

[tasks."example:html-template:build"]
description = "html-template: build it both ways."
depends = ["example:html-template:build:dynamic", "example:html-template:build:static"]

# The bench tasks time one way at a time, after every build: wait_for waits for a task only if it is running, so
# bench:static alone runs just itself.

[tasks."example:html-template:bench:dynamic"]
description = "html-template: time it, dynamic: in-process, then its build served, into build/bench/."
depends = ["example:html-template:build:dynamic", "tools:dev"]
wait_for = ["example:html-template:build"]
dir = "examples/html-template"
run = "structpages-dev bench dynamic"

[tasks."example:html-template:bench:static"]
description = "html-template: time it, static: in-process, then its build served, into build/bench/."
depends = ["example:html-template:build:static", "tools:dev"]
wait_for = ["example:html-template:build", "example:html-template:bench:dynamic"]
dir = "examples/html-template"
run = "structpages-dev bench static"

[tasks."example:html-template:bench"]
description = "html-template: time it both ways, one at a time, and compare them into BENCH_GENERATED.md."
depends = ["example:html-template:build", "example:html-template:bench:dynamic", "example:html-template:bench:static"]
dir = "examples/html-template"
run = "structpages-dev report"

