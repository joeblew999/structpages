# ---- Every example at once -------------------------------------------------------------------------------------------

[tasks."examples:generate"]
description = "Every example's generate task: each example's generated files, in order."
depends = [
  "example:blog:generate",
  "example:html-template:generate",
  "example:htmx:generate",
  "example:htmx-render-target:generate",
  "example:lint-misuse:generate",
  "example:simple:generate",
  "example:todo:generate",
  "example:url-validation:generate",
]

[tasks.examples]
description = """Every example's tests, each the ways it runs (all three, or dynamic and static for html-template and \
lint-misuse): a line each way. One example: example:<name>:test."""
depends = ["example:blog:test", "example:html-template:test", "example:htmx:test", "example:htmx-render-target:test", "example:lint-misuse:test", "example:simple:test", "example:todo:test", "example:url-validation:test"]

[tasks."bench:examples"]
description = """Every example's benchmarks, each into its own BENCH_GENERATED.md, one example after another so no two \
are timed at once (lint-misuse, a linter fixture, has none). One example: example:<name>:bench."""
run = [
  "mise run example:blog:bench",
  "mise run example:html-template:bench",
  "mise run example:htmx:bench",
  "mise run example:htmx-render-target:bench",
  "mise run example:simple:bench",
  "mise run example:todo:bench",
  "mise run example:url-validation:bench",
]

[tasks."lint:examples"]
description = "structpages-lint (tools/lint) over every example but lint-misuse, whose misuses are deliberate."
depends = ["examples:generate"]
dir = "tools/lint"
run = '''
fail=0
for d in ../../examples/*/; do
  case "$d" in */lint-misuse/) continue ;; esac
  echo "== $d"
  # The linter loads packages from its working directory, so -exec starts it in the example's.
  go run -exec "sh -c 'cd $d && exec \"\$@\"' sh" ./cmd/structpages-lint ./... || fail=1
done
exit $fail
'''

# ---- What upstream's CI checks, on standard Go --------------------------------------------------------------------

[tasks."ci:go"]
description = """Everything CI checks on standard Go: fmt, vet, lint, generated:check, then the library and every \
example tested the dynamic way."""
depends = ["fmt", "vet", "lint", "generated:check", "test:dynamic", "example:blog:test:dynamic", "example:html-template:test:dynamic", "example:htmx:test:dynamic", "example:htmx-render-target:test:dynamic", "example:lint-misuse:test:dynamic", "example:simple:test:dynamic", "example:todo:test:dynamic", "example:url-validation:test:dynamic"]

[tasks."generated:check"]
description = """Every generate task, then fail if a generated file the examples commit (.x.go, \
structpages_static.generated.go, testdata/e2e.generated.txt) changed or is new and isn't added to git: commit it with the code \
it comes from. CI checks the same on a fresh checkout."""
depends = ["generate", "examples:generate"]
run = '''
changed=$(git status --porcelain --untracked-files=all -- '*.x.go' '*.generated.go' '*.generated_test.go' '*.generated.txt' | grep '^.[^ ]' || true)
if [ -n "$changed" ]; then
  echo "These generated files changed and aren't added to git: commit them with the code they come from."
  echo "$changed"
  exit 1
fi
echo "Every generated file is committed."
'''

[tasks.fmt]
description = "Fail if any file needs gofmt (CI's Format job)."
wait_for = ["generate", "examples:generate"] # not while they write files, when ci:go runs them too
run = 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'

# vet and lint check each module, and again with the build tags that pick other files: the library's static and
# tinygo files (e2e's among them, and the library's generated test files, so they run after generate) and the workers
# module's js/wasm one, which TinyGo builds.
[tasks.vet]
depends = ["generate"]
description = "go vet on the library, workers, tools/static, tools/dev and tools/workers, each build too (CI's Format job)."
run = [
  "go vet ./...",
  "go vet -tags structpages_static ./...",
  "go vet -tags tinygo ./...",
  "go vet -C workers ./...",
  "GOOS=js GOARCH=wasm go vet -C workers ./...",
  "go vet -C tools/static ./...",
  "go vet -C tools/dev ./...",
  "go vet -C tools/workers ./...",
]

[tasks.lint]
depends = ["generate"]
description = "golangci-lint on the library, workers, tools/static, tools/dev and tools/workers, each build too (CI's Lint job)."
run = [
  "golangci-lint run --timeout=5m",
  "golangci-lint run --timeout=5m --build-tags structpages_static",
  "golangci-lint run --timeout=5m --build-tags tinygo",
  "cd workers && golangci-lint run --timeout=5m",
  "cd workers && GOOS=js GOARCH=wasm golangci-lint run --timeout=5m",
  "cd tools/static && golangci-lint run --timeout=5m",
  "cd tools/dev && golangci-lint run --timeout=5m",
  "cd tools/workers && golangci-lint run --timeout=5m",
]
