# ---- examples/url-validation: its tasks, one per step, in the order they run -----------------------------------------
#
# Each task runs in examples/url-validation, after the tasks it depends on:
#   generate:structpages-static -> generate:e2e
#     -> test:dynamic, test:static, test:static-worker
#     -> build:dynamic       -> serve:dynamic
#     -> build:static        -> serve:static
#     -> build:static-worker -> serve:static-worker
#   build (all three) -> bench:dynamic -> bench:static -> bench:static-worker -> bench (the report)
# Builds go in examples/url-validation/build/ (gitignored). `mise tasks deps example:url-validation:serve:static` prints a chain.
# The serve tasks have raw = true: mise hands them the terminal, as typing the command yourself does, so the server's
# log lines show as they are, without the task's name in front of each. It changes nothing about what runs.

[tasks."example:url-validation:generate:structpages-static"]
description = "url-validation: structpages-static generate makes structpages_static.generated.go."
dir = "examples/url-validation"
run = "go tool structpages-static generate"

[tasks."example:url-validation:generate:e2e"]
description = "url-validation: the e2e test records url-validation's answers into testdata/e2e.generated.txt."
depends = ["example:url-validation:generate:structpages-static"]
dir = "examples/url-validation"
run = "go test -update"

[tasks."example:url-validation:generate"]
description = "url-validation: all two generate tasks."
depends = ["example:url-validation:generate:e2e"]

[tasks."example:url-validation:test:dynamic"]
description = "url-validation: test it, dynamic."
depends = ["example:url-validation:generate", "tools:dev"]
dir = "examples/url-validation"
run = "structpages-dev test dynamic"

[tasks."example:url-validation:test:static"]
description = "url-validation: test it, static."
depends = ["example:url-validation:generate", "tools:dev"]
dir = "examples/url-validation"
run = "structpages-dev test static"

[tasks."example:url-validation:test:static-worker"]
description = "url-validation: test it, static-worker."
depends = ["example:url-validation:generate", "tools:dev"]
dir = "examples/url-validation"
run = "structpages-dev test static-worker"

[tasks."example:url-validation:test"]
description = "url-validation: test it all three ways."
depends = ["example:url-validation:test:dynamic", "example:url-validation:test:static", "example:url-validation:test:static-worker"]

[tasks."example:url-validation:build:dynamic"]
description = "url-validation: build it, dynamic, into build/dynamic."
depends = ["example:url-validation:generate"]
dir = "examples/url-validation"
run = "go build -o build/dynamic ."

[tasks."example:url-validation:serve:dynamic"]
description = "url-validation: serve its dynamic build on :8080 until Ctrl-C."
depends = ["example:url-validation:build:dynamic", "tools:dev"]
dir = "examples/url-validation"
raw = true
run = "structpages-dev serve dynamic"

[tasks."example:url-validation:build:static"]
description = "url-validation: build it, static, into build/static."
depends = ["example:url-validation:generate"]
dir = "examples/url-validation"
run = "go build -tags structpages_static -o build/static ."

[tasks."example:url-validation:serve:static"]
description = "url-validation: serve its static build on :8080 until Ctrl-C."
depends = ["example:url-validation:build:static", "tools:dev"]
dir = "examples/url-validation"
raw = true
run = "structpages-dev serve static"

[tasks."example:url-validation:build:static-worker"]
description = "url-validation: build it, static-worker: a Worker (TinyGo WebAssembly and its glue), into build/static-worker/."
depends = ["example:url-validation:generate"]
dir = "examples/url-validation"
run = "go tool structpages-workers -o build/static-worker"

[tasks."example:url-validation:serve:static-worker"]
description = "url-validation: serve its static-worker build in workerd on :8080 until Ctrl-C."
