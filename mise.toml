# ---- The repo's two tools, over every example -------------------------------------------------------------------

[tasks."gen:examples"]
description = """structpages-gen (tools/gen) over every example: regenerates gsx output, then writes \
structpages_tables.generated.go into each package with pages, and lists what it wrote."""
run = '''
fail=0
for d in examples/*/; do
  echo "== $d"
  if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then
    (cd "$d" && go tool gsx generate -q .) || fail=1
  fi
  go run -C tools/gen ./cmd/structpages-gen -C "{{config_root}}/$d" ./... || fail=1
  find "$d" -name 'structpages_tables*.generated*.go' | sed 's/^/   generated: /'
done
exit $fail
'''

[tasks."lint:examples"]
description = "structpages-lint (tools/lint) over every example but lint-misuse, whose misuses are deliberate."
dir = "tools/lint"
run = '''
fail=0
for d in ../../examples/*/; do
  case "$d" in */lint-misuse/) continue ;; esac
  echo "== $d"
  # The linter loads packages from its working directory, so -exec starts it in the example's.
  go run -exec "sh -c 'cd $d && exec \"\$@\"' sh" ./cmd/structpages-lint ./... || fail=1
done
exit $fail
'''

[tasks."clean:generated"]
description = "Delete everything generated: the structpages_tables*.generated*.go files and the examples' worker.generated/."
run = [
  "find . -name 'structpages_tables*.generated*.go' -not -path './.git/*' -print -delete | sed 's/^/deleted /'",
  "find examples -type d -name worker.generated -prune -print -exec rm -rf {} + | sed 's/^/deleted /'",
]

# ---- Benchmarks, three ways ---------------------------------------------------------------------------------------

[tasks.bench]
description = "The library's benchmarks, reflect (PERFORMANCE.md)."
run = "go test -run NoTest -bench . -benchmem ."

[tasks."bench:compare"]
description = """The library's benchmarks three ways (6 runs of 200ms each), compared with benchstat, into \
BENCH-COMPARE.GENERATED.md."""
shell = "bash -c"
run = '''
set -euo pipefail
flags=(-run NoTest -bench . -benchmem -count 6 -benchtime 200ms)
quiet() { "$@" 2> >(grep -v 'structpages-gen: warning' >&2); }
echo "running reflect..."; reflect=$(go test "${flags[@]}" .)
echo "running generated..."; quiet go run -C tools/gen ./cmd/structpages-gen -C {{config_root}} -test ./...
generated=$(go test -tags structpages_tables "${flags[@]}" .)
# TinyGo prints no -N CPU suffix or goos/pkg/cpu lines, and 0 for every allocs/op, so those are left out.
echo "running tinygo..."; tinygo=$(quiet scripts/tinygo-test.sh "${flags[@]}" | sed -E 's/[[:space:]]+0 allocs\/op//')
result=$(benchstat -ignore goos,goarch,pkg,cpu,/gomaxprocs reflect=<(echo "$reflect") generated=<(echo "$generated") tinygo=<(echo "$tinygo"))
echo "$result"
cat > BENCH-COMPARE.GENERATED.md <<EOF
<!-- Generated by \`mise run bench:compare\`. Do not edit: run it again. -->

# Benchmark comparison: the library

- reflect: standard Go, structpages reading methods through reflect
- generated: standard Go, reading generated code instead (-tags structpages_tables)
- tinygo: TinyGo, which reads the generated code too; it reports no allocs/op

Commit $(git rev-parse --short HEAD)$(git diff --quiet HEAD || echo ' + uncommitted changes'), $(date -u +%Y-%m-%dT%H:%MZ).
$(go version | cut -d' ' -f3-), $(tinygo version | cut -d' ' -f3-4), $(echo "$reflect" | sed -n 's/^cpu: //p').
Every benchmark, 6 runs of 200ms each.

\`\`\`
$result
\`\`\`
EOF
echo "wrote BENCH-COMPARE.GENERATED.md"
'''

[tasks."bench:examples"]
description = """Every example's BenchmarkCheck (its recorded GETs) three ways, in-process and as served, into the \
example's own BENCH.GENERATED.md. One example: example:<name>:bench."""
quiet = true
run = '''
for d in examples/*/; do
  grep -qs 'func BenchmarkCheck' "$d/check_test.go" || continue
  mise run _bench "$(basename "$d")" || exit 1
done
'''

[tasks._bench]
description = """examples/<name>'s BenchmarkCheck three ways, in-process and as served (tinygo: WebAssembly in \
workerd), compared with benchstat, into its BENCH.GENERATED.md."""
hide = true
quiet = true
shell = "bash -c"
usage = '''arg "<name>" help="the example's folder under examples/"'''
run = '''
set -euo pipefail
d="examples/$usage_name/"; name=$usage_name
if ! grep -qs 'func BenchmarkCheck' "$d/check_test.go"; then
  echo "examples/$name has no BenchmarkCheck yet: add one to check_test.go, like examples/todo's" >&2; exit 2
fi
flags=(-run NoTest -bench BenchmarkCheck -benchmem -count 6 -benchtime 200ms)
gen() { go run -C tools/gen ./cmd/structpages-gen -C "{{config_root}}/$d" -test "$@" ./... 2> >(grep -v 'structpages-gen: warning' >&2); }
if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then (cd "$d" && go tool gsx generate -q .); fi

# In-process: each way's own test binary calls the handler directly.
echo "== $name, in-process: reflect..."; reflect=$(cd "$d" && go test "${flags[@]}" .)
echo "== $name, in-process: generated..."; gen; generated=$(cd "$d" && go test -tags structpages_tables "${flags[@]}" .)
echo "== $name, in-process: tinygo..."; gen -tags tinygo
# TinyGo prints no -N CPU suffix or goos/pkg/cpu lines, and 0 for every allocs/op, so those are left out.
tinygo=$(cd "$d" && tinygo test "${flags[@]}" . | sed -E 's/[[:space:]]+0 allocs\/op//')
result=$(benchstat -ignore goos,goarch,pkg,cpu,/gomaxprocs reflect=<(echo "$reflect") generated=<(echo "$generated") tinygo=<(echo "$tinygo"))
echo "$result"

# As served: each way started as its example:<name>[:way] task serves it, on :8080, and timed over local HTTP by
# one standard Go client (CHECK_URL), so all three pay the same network cost. Times only: allocations would be the
# client's.
served() {
  if lsof -ti tcp:8080 >/dev/null; then echo "port 8080 is in use: stop what is on it first" >&2; exit 1; fi
  mise run _example "$name" "$1" >/dev/null 2>&1 &
  curl -s -o /dev/null --retry-connrefused --retry 300 --retry-delay 1 --max-time 400 http://localhost:8080/ ||
    { echo "examples/$name, $1: the server never answered" >&2; exit 1; }
  (cd "$d" && CHECK_URL=http://localhost:8080 go test -run NoTest -bench BenchmarkCheck -count 6 -benchtime 200ms .)
  lsof -ti tcp:8080 | xargs kill 2>/dev/null || true
  wait 2>/dev/null || true
  while lsof -ti tcp:8080 >/dev/null; do sleep 0.2; done
}
served_result="(not served under TinyGo: examples/$name has no serve_js.go yet)"
echo "== $name, served: reflect..."; s_reflect=$(served reflect)
echo "== $name, served: generated..."; s_generated=$(served generated)
if [ -f "$d/serve_js.go" ]; then
  echo "== $name, served: tinygo, in workerd..."; s_tinygo=$(served tinygo)
  wasm="$(du -k "$d/worker.generated/app.wasm" | cut -f1) KB"
  served_result=$(benchstat -ignore goos,goarch,pkg,cpu,/gomaxprocs reflect=<(echo "$s_reflect") generated=<(echo "$s_generated") tinygo=<(echo "$s_tinygo"))
fi
echo "$served_result"

cat > "$d/BENCH.GENERATED.md" <<EOF
<!-- Generated by \`mise run bench:examples\` or \`mise run example:$name:bench\`. Do not edit: run it again. -->

# $name: benchmarks, three ways

BenchmarkCheck (check_test.go) times each GET that $name's check recorded (testdata/check.generated.txt):

- reflect: standard Go, structpages reading methods through reflect
- generated: standard Go, reading generated code instead (-tags structpages_tables)
- tinygo: TinyGo, which reads the generated code too

Commit $(git rev-parse --short HEAD)$(git diff --quiet HEAD || echo ' + uncommitted changes'), $(date -u +%Y-%m-%dT%H:%MZ).
$(go version | cut -d' ' -f3-), $(tinygo version | cut -d' ' -f3-4), $(echo "$reflect" | sed -n 's/^cpu: //p'), workerd $(workerd --version 2>/dev/null | cut -d' ' -f2).
6 runs of 200ms each.

## In-process

Each way's test binary calls the app's handler directly (TinyGo's natively, and it reports no allocs/op).

\`\`\`
$result
\`\`\`

## As served

Each way served on :8080 as its example:$name task serves it (tinygo: ${wasm:-no} WebAssembly in workerd, what
Cloudflare runs), timed over local HTTP by one standard Go client, so all three pay the same network cost.

\`\`\`
$served_result
\`\`\`
EOF
echo "wrote ${d}BENCH.GENERATED.md"
'''

# ---- What upstream's CI checks, on standard Go --------------------------------------------------------------------

[tasks."ci:go"]
description = "Everything CI checks on standard Go: test, fmt, vet, lint, test:examples."
depends = ["test", "fmt", "vet", "lint", "test:examples"]

[tasks.fmt]
description = "Fail if any file needs gofmt (CI's Format job)."
run = 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'

[tasks.vet]
description = "go vet on the library, tools/gen, tools/check and servemux (CI's Format job)."
run = ["go vet ./...", "go vet -C tools/gen ./...", "go vet -C tools/check ./...", "go vet -C servemux ./..."]

[tasks.lint]
description = "golangci-lint on the library, tools/gen and tools/check (CI's Lint job)."
run = [
  "golangci-lint run --timeout=5m",
  "cd tools/gen && golangci-lint run --timeout=5m",
  "cd tools/check && golangci-lint run --timeout=5m",
]
