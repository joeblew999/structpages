# ---- Benchmarks, three ways: the library (the root folder) and each example, the same way -------------------------

[tasks.bench]
description = """The library's benchmarks three ways (6 runs of 200ms each), compared with benchstat, into \
BENCH_GENERATED.md."""
quiet = true
run = "{{vars.dev}} bench ."

[tasks."bench:examples"]
description = """Every example with benchmarks (examples/todo, so far), three ways, in-process and as served, each into \
its own BENCH_GENERATED.md, as bench does for the library. examples/todo alone: example:todo:bench."""
quiet = true
run = [
  "{{vars.dev}} bench examples/todo",
]

[tasks."example:todo:bench"]
description = "examples/todo's benchmarks three ways, into examples/todo/BENCH_GENERATED.md."
quiet = true
run = "{{vars.dev}} bench examples/todo"

# ---- The repo's two tools, over every example -------------------------------------------------------------------

[tasks."gen:examples"]
description = """structpages-gen (tools/gen) over every example: regenerates gsx output, then writes \
structpages.generated.go into each package with pages, and lists what it wrote."""
run = '''
fail=0
for d in examples/*/; do
  echo "== $d"
  if grep -q 'gsxhq/gsx/cmd/gsx' "$d/go.mod"; then
    (cd "$d" && go tool gsx generate -q .) || fail=1
  fi
  go run -C tools/gen ./cmd/structpages-gen -C "{{config_root}}/$d" ./... || fail=1
  find "$d" -name 'structpages*.generated*.go' | sed 's/^/   generated: /'
done
exit $fail
'''

[tasks."lint:examples"]
description = "structpages-lint (tools/lint) over every example but lint-misuse, whose misuses are deliberate."
dir = "tools/lint"
run = '''
fail=0
for d in ../../examples/*/; do
  case "$d" in */lint-misuse/) continue ;; esac
  echo "== $d"
  # The linter loads packages from its working directory, so -exec starts it in the example's.
  go run -exec "sh -c 'cd $d && exec \"\$@\"' sh" ./cmd/structpages-lint ./... || fail=1
done
exit $fail
'''

[tasks."clean:generated"]
description = "Delete everything generated: the structpages*.generated*.go files, if a run was stopped before it could."
run = "find . -name 'structpages*.generated*.go' -not -path './.git/*' -print -delete | sed 's/^/deleted /'"

# ---- What upstream's CI checks, on standard Go --------------------------------------------------------------------

[tasks."ci:go"]
description = """Everything CI checks on standard Go: fmt, vet, lint, then the library and every example built and \
tested the reflect way, as test and examples do."""
depends = ["fmt", "vet", "lint"]
quiet = true
run = [
  "{{vars.dev}} test -ways reflect .",
  "{{vars.dev}} test -ways reflect examples/blog",
  "{{vars.dev}} test -ways reflect examples/html-template",
  "{{vars.dev}} test -ways reflect examples/htmx",
  "{{vars.dev}} test -ways reflect examples/htmx-render-target",
  "{{vars.dev}} test -ways reflect examples/lint-misuse",
  "{{vars.dev}} test -ways reflect examples/simple",
  "{{vars.dev}} test -ways reflect examples/todo",
  "{{vars.dev}} test -ways reflect examples/url-validation",
]

[tasks.fmt]
description = "Fail if any file needs gofmt (CI's Format job)."
run = 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'

# vet and lint check each module, and again with the build tags that pick other files: the library's generated and
# tinygo files, tools/e2e's tinygo one and the workers module's js/wasm one, which TinyGo builds.

[tasks.vet]
description = "go vet on the library, workers, tools/gen, tools/e2e, tools/dev and tools/workers, each build too (CI's Format job)."
run = [
  "go vet ./...",
  "go vet -tags structpages_generated ./...",
  "go vet -tags tinygo ./...",
  "go vet -C workers ./...",
  "GOOS=js GOARCH=wasm go vet -C workers ./...",
  "go vet -C tools/gen ./...",
  "go vet -C tools/e2e ./...",
  "go vet -C tools/e2e -tags tinygo ./...",
  "go vet -C tools/dev ./...",
  "go vet -C tools/workers ./...",
]

[tasks.lint]
description = "golangci-lint on the library, workers, tools/gen, tools/e2e, tools/dev and tools/workers, each build too (CI's Lint job)."
run = [
  "golangci-lint run --timeout=5m",
  "golangci-lint run --timeout=5m --build-tags structpages_generated",
  "golangci-lint run --timeout=5m --build-tags tinygo",
  "cd workers && golangci-lint run --timeout=5m",
  "cd workers && GOOS=js GOARCH=wasm golangci-lint run --timeout=5m",
  "cd tools/gen && golangci-lint run --timeout=5m",
  "cd tools/e2e && golangci-lint run --timeout=5m",
  "cd tools/e2e && golangci-lint run --timeout=5m --build-tags tinygo",
  "cd tools/dev && golangci-lint run --timeout=5m",
  "cd tools/workers && golangci-lint run --timeout=5m",
]
