raw = true
quiet = true
run = "mise run _example htmx generated"

[tasks."example:htmx-render-target:serve:reflect"]
description = "Serve examples/htmx-render-target on :8080, reflect."
raw = true
quiet = true
run = "mise run _example htmx-render-target"

[tasks."example:htmx-render-target:serve:generated"]
description = "Serve examples/htmx-render-target on :8080, generated."
raw = true
quiet = true
run = "mise run _example htmx-render-target generated"

[tasks."example:simple:serve:reflect"]
description = "Serve examples/simple on :8080, reflect."
raw = true
