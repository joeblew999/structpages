# Local dev setup for this fork's tinygo branch (upstream has no mise file); versions follow
# .github/workflows/ci.yml. `mise tasks` lists everything.
#
# structpages runs three ways, and most tasks come in threes:
#   dynamic        standard Go, the default: structpages finds the app's methods at run time, with reflect
#   static         standard Go, -tags structpages_static: they are known at compile time, from the code `structpages-static generate` writes
#   static-worker  a Cloudflare Worker: TinyGo WebAssembly, static too
#
# THE ORDER. Some files are made from others, so an example's steps run in an order, each reading what the one
# before wrote: 1 gsx (.gsx -> .x.go), 2 structpages (structpages-static generate -> structpages_static.generated.go), 3 record (the e2e test
# from the dynamic build -> testdata/e2e.generated.txt), 4 test, bench or serve (structpages-dev). examples/todo's
# section below has each step as its own task (generate:gsx, generate:structpages-static, generate:e2e, then test, bench,
# serve), each depending on the one before. The other examples' generate tasks
# do their steps 1 and 2 in order until they get todo's shape.
#
# What generate makes is committed for the examples, as upstream commits .x.go: commit it with the code it comes
# from (generated:check, and so ci:go, fails until you have). A change to testdata/e2e.generated.txt is a change in
# what the app answers: review its diff. The library's generated files are for its own tests only and gitignored.
# A task over several folders lists them, a line each.

[tools]
go = "1.26"
tinygo = "0.43.0"
"aqua:WebAssembly/binaryen" = "133" # wasm-opt, for TinyGo's WebAssembly builds
workerd = "1.20261019.1"            # Cloudflare's Workers runtime, to serve TinyGo builds locally
golangci-lint = "2"
"go:golang.org/x/perf/cmd/benchstat" = "latest"

[env]
# structpages-dev, which tools:dev builds, is on the path for every task.
_.path = ["{{config_root}}/build/bin"]

[vars]
# structpages-dev from this repository, working in its root; the folder and what to do follow.
dev = "go run -C tools/dev ./cmd/structpages-dev -C {{config_root}}"
# structpages-static generate from this repository (step 2); -C, the folder, follows.
structpages_static = "go run -C tools/static ./cmd/structpages-static generate"

# ---- This repository's dev tool -----------------------------------------------------------------------------------

[tasks."tools:dev"]
description = "Build structpages-dev (tools/dev) into build/bin, on the path for every task; again only when its code changes."
sources = ["tools/dev/**/*.go", "tools/dev/go.mod"]
outputs = ["build/bin/structpages-dev"]
run = "go build -C tools/dev -o {{config_root}}/build/bin/structpages-dev ./cmd/structpages-dev"

# ---- Generate: each folder's generated files, in THE ORDER above ---------------------------------------------------

[tasks.generate]
description = """The library's generated files (step 2), for its own tests' static and static-worker builds: gitignored. \
test, bench, vet and lint run it first."""
run = "{{vars.structpages_static}} -C {{config_root}} -test ./..."

[tasks."examples:generate"]
description = "Every example's generate task: each example's generated files, in order."
depends = [
  "example:blog:generate",
  "example:html-template:generate",
  "example:htmx:generate",
  "example:htmx-render-target:generate",
  "example:lint-misuse:generate",
  "example:simple:generate",
  "example:todo:generate",
  "example:url-validation:generate",
]

[tasks."example:blog:generate"]
description = "examples/blog's generated files, in order: .x.go, then structpages_static.generated.go. Commit what changes."
run = [
  "go -C examples/blog tool gsx generate -q -no-cache .",      # 1. .gsx -> .x.go
  "{{vars.structpages_static}} -C {{config_root}}/examples/blog -test ./...", # 2. -> structpages_static.generated.go
]

[tasks."example:html-template:generate"]
description = "examples/html-template's generated file: structpages_static.generated.go (it uses no gsx, and has no e2e test yet). Commit what changes."
run = [
  "{{vars.structpages_static}} -C {{config_root}}/examples/html-template -test ./...", # 2. -> structpages_static.generated.go
]

[tasks."example:lint-misuse:generate"]
description = "examples/lint-misuse's generated files, in order: .x.go, then structpages_static.generated.go. Commit what changes. Never built the static way (its tests check the linter), but made like every example's."
run = [
  "go -C examples/lint-misuse tool gsx generate -q -no-cache .",      # 1. .gsx -> .x.go
  "{{vars.structpages_static}} -C {{config_root}}/examples/lint-misuse -test ./...", # 2. -> structpages_static.generated.go
]

[tasks."generated:check"]
description = """Every generate task, then fail if a generated file the examples commit (.x.go, \
structpages_static.generated.go, testdata/e2e.generated.txt) changed or is new and isn't added to git: commit it with the code \
it comes from. CI checks the same on a fresh checkout."""
depends = ["generate", "examples:generate"]
run = '''
changed=$(git status --porcelain --untracked-files=all -- '*.x.go' '*.generated.go' '*.generated_test.go' '*.generated.txt' | grep '^.[^ ]' || true)
if [ -n "$changed" ]; then
  echo "These generated files changed and aren't added to git: commit them with the code they come from."
  echo "$changed"
  exit 1
fi
echo "Every generated file is committed."
'''

# ---- examples/htmx: its tasks, one per step, in the order they run ---------------------------------------------------
#
# Each task runs in examples/htmx, after the tasks it depends on:
#   generate:gsx -> generate:structpages-static -> generate:e2e
#     -> test:dynamic, test:static, test:static-worker
#     -> build:dynamic       -> serve:dynamic
#     -> build:static        -> serve:static
#     -> build:static-worker -> serve:static-worker
#   build (all three) -> bench:dynamic -> bench:static -> bench:static-worker -> bench (the report)
# Builds go in examples/htmx/build/ (gitignored). `mise tasks deps example:htmx:serve:static` prints a chain.
# The serve tasks have raw = true: mise hands them the terminal, as typing the command yourself does, so the server's
# log lines show as they are, without the task's name in front of each. It changes nothing about what runs.

[tasks."example:htmx:generate:gsx"]
description = "htmx: gsx makes the .x.go files."
dir = "examples/htmx"
run = "go tool gsx generate"

[tasks."example:htmx:generate:structpages-static"]
description = "htmx: structpages-static generate makes structpages_static.generated.go."
depends = ["example:htmx:generate:gsx"]
dir = "examples/htmx"
run = "go tool structpages-static generate"

[tasks."example:htmx:generate:e2e"]
description = "htmx: the e2e test records htmx's answers into testdata/e2e.generated.txt."
depends = ["example:htmx:generate:structpages-static"]
dir = "examples/htmx"
run = "go test -update"

[tasks."example:htmx:generate"]
description = "htmx: all three generate tasks."
depends = ["example:htmx:generate:e2e"]

[tasks."example:htmx:test:dynamic"]
description = "htmx: test it, dynamic."
depends = ["example:htmx:generate", "tools:dev"]
dir = "examples/htmx"
run = "structpages-dev test dynamic"

[tasks."example:htmx:test:static"]
description = "htmx: test it, static."
depends = ["example:htmx:generate", "tools:dev"]
dir = "examples/htmx"
run = "structpages-dev test static"

[tasks."example:htmx:test:static-worker"]
description = "htmx: test it, static-worker."
depends = ["example:htmx:generate", "tools:dev"]
dir = "examples/htmx"
run = "structpages-dev test static-worker"

[tasks."example:htmx:test"]
description = "htmx: test it all three ways."
depends = ["example:htmx:test:dynamic", "example:htmx:test:static", "example:htmx:test:static-worker"]

[tasks."example:htmx:build:dynamic"]
description = "htmx: build it, dynamic, into build/dynamic."
depends = ["example:htmx:generate"]
dir = "examples/htmx"
run = "go build -o build/dynamic ."

[tasks."example:htmx:serve:dynamic"]
description = "htmx: serve its dynamic build on :8080 until Ctrl-C."
depends = ["example:htmx:build:dynamic", "tools:dev"]
dir = "examples/htmx"
raw = true
run = "structpages-dev serve dynamic"

[tasks."example:htmx:build:static"]
description = "htmx: build it, static, into build/static."
depends = ["example:htmx:generate"]
dir = "examples/htmx"
run = "go build -tags structpages_static -o build/static ."

[tasks."example:htmx:serve:static"]
description = "htmx: serve its static build on :8080 until Ctrl-C."
depends = ["example:htmx:build:static", "tools:dev"]
dir = "examples/htmx"
raw = true
run = "structpages-dev serve static"

[tasks."example:htmx:build:static-worker"]
description = "htmx: build it, static-worker: a Worker (TinyGo WebAssembly and its glue), into build/static-worker/."
depends = ["example:htmx:generate"]
dir = "examples/htmx"
run = "go tool structpages-workers -o build/static-worker"

[tasks."example:htmx:serve:static-worker"]
description = "htmx: serve its static-worker build in workerd on :8080 until Ctrl-C."
depends = ["example:htmx:build:static-worker", "tools:dev"]
dir = "examples/htmx"
raw = true
run = "structpages-dev serve static-worker"

[tasks."example:htmx:build"]
description = "htmx: build it all three ways."
depends = ["example:htmx:build:dynamic", "example:htmx:build:static", "example:htmx:build:static-worker"]

# The bench tasks time one way at a time, after every build: wait_for waits for a task only if it is running, so
# bench:static alone runs just itself.

[tasks."example:htmx:bench:dynamic"]
description = "htmx: time it, dynamic: in-process, then its build served, into build/bench/."
depends = ["example:htmx:build:dynamic", "tools:dev"]
wait_for = ["example:htmx:build"]
dir = "examples/htmx"
run = "structpages-dev bench dynamic"

[tasks."example:htmx:bench:static"]
description = "htmx: time it, static: in-process, then its build served, into build/bench/."
depends = ["example:htmx:build:static", "tools:dev"]
wait_for = ["example:htmx:build", "example:htmx:bench:dynamic"]
dir = "examples/htmx"
run = "structpages-dev bench static"

[tasks."example:htmx:bench:static-worker"]
description = "htmx: time it, static-worker: in-process, then its build served in workerd, into build/bench/."
depends = ["example:htmx:build:static-worker", "tools:dev"]
wait_for = ["example:htmx:build", "example:htmx:bench:static"]
dir = "examples/htmx"
run = "structpages-dev bench static-worker"

[tasks."example:htmx:bench"]
description = "htmx: time it all three ways, one at a time, and compare them into BENCH_GENERATED.md."
depends = ["example:htmx:build", "example:htmx:bench:dynamic", "example:htmx:bench:static", "example:htmx:bench:static-worker"]
dir = "examples/htmx"
run = "structpages-dev report"

