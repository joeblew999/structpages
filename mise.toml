#
# Dynamic and static here. Only todo serves as static-worker, WebAssembly in workerd, so far: see its section.

[tasks."example:blog:serve:dynamic"]
description = "Serve examples/blog on :8080, dynamic."
depends = ["example:blog:generate"]
raw = true
quiet = true
run = "{{vars.dev}} serve examples/blog dynamic"

[tasks."example:blog:serve:static"]
